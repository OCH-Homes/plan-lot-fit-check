<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lot Fit Sheet — Olivia Clarke Homes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* ---------------------------------------------------------------------
     OCH brand, Jan 2025 guidelines. The brand fonts MADE Mirage and Cooper
     Hewitt are licensed and cannot be embedded in a web page, so this uses the
     sanctioned fallbacks the guidelines name: Playfair Display for headers,
     Calibri for subheads and body. Serif for headers, sans for everything
     else — those roles are never swapped.

     Colour roles are taken from the hierarchy page, not invented:
       OCH Green   headlines on white
       Slate       subheads and thin rules
       Black       body copy
       Eggshell    the page surround
     The DRAWING stays pure black on white. It is a dimensioned technical
     figure that gets printed, photocopied and faxed, and colour there would
     cost legibility for no gain.
     --------------------------------------------------------------------- */
  :root{ --ink:#000; --mid:#51504C; --light:#8A8A8A; --faint:#BFBFBF;
         --och-green:#3E645D; --dark-green:#223D40; --eggshell:#F2EBE5; --bone:#C4B6AD;
         --serif:'Playfair Display',Georgia,'Times New Roman',serif;
         --sans:Calibri,'Segoe UI',system-ui,-apple-system,sans-serif; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--eggshell);color:var(--ink);
       font-family:var(--sans);font-size:12.5px}

  /* ---- controls: screen only, never printed ---- */
  .bar{background:#fff;border-bottom:1px solid var(--ink);padding:10px 16px;
       display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap;position:sticky;top:0;z-index:5}
  .bar label{font-size:10px;color:var(--mid);text-transform:uppercase;letter-spacing:.06em;
             display:block;margin-bottom:3px}
  select,button{font-family:var(--sans);font-size:12.5px;padding:5px 9px;
                border:1px solid var(--light);border-radius:0;background:#fff;color:var(--ink)}
  button{cursor:pointer}
  .seg{display:flex;border:1px solid var(--light)}
  .seg button{border:0;background:#fff}
  .seg button.on{background:var(--och-green);color:#fff;border-color:var(--och-green)}
  /* A side chosen against this lot's lock reads red, not green. */
  .seg button.on.ovr{background:#A6392E;border-color:#A6392E}
  .lockOn{color:var(--och-green)} .lockEither{color:var(--mid)} .lockOvr{color:#A6392E}
  .mini{font-size:10px;padding:1px 6px;text-transform:uppercase;letter-spacing:.06em}

  /* ---- the sheet ---- */
  /* Fixed letter page. The drawing is the only elastic block: it takes whatever
     height the header, specs, verdict and notes leave, and the SVG scales into
     it uniformly. That is what guarantees one page, on screen and on paper. */
  .sheet{width:8.5in;height:11in;margin:18px auto;background:#fff;padding:0.5in;
         box-shadow:0 1px 10px rgba(0,0,0,.2);display:flex;flex-direction:column;
         overflow:hidden}

  .title{display:flex;justify-content:space-between;align-items:flex-start;
         border-bottom:1px solid var(--och-green);padding-bottom:8px}
  .title .addr{font-family:var(--serif);font-size:23px;font-weight:400;letter-spacing:0;
               color:var(--och-green);line-height:1.15}
  .title .bl{font-size:10.5px;color:var(--mid);margin-top:4px;letter-spacing:.06em;
             text-transform:uppercase}
  .title .right{text-align:right;font-size:9.5px;color:var(--mid);line-height:1.65;
                letter-spacing:.06em;text-transform:uppercase}
  .title .right b{display:block;font-family:var(--serif);font-size:11px;color:var(--och-green);
                  letter-spacing:.14em;font-weight:500;text-transform:uppercase}
  /* Official approved artwork, primary stacked lockup in green, placed as the
     file — never redrawn. Green on a white page per the pairing rule. Height is
     0.62in, above the 0.5in minimum for this lockup, with clear space of at
     least the height of the "O". */
  .title .logo{display:block;height:0.62in;width:auto;margin:0 0 7px auto}

  /* Verdict banner, directly under the address. Monochrome like everything else
     — weight and a heavy rule carry it, not colour, because this page is printed
     black and white. */
  .banner{border:2.5px solid var(--ink);padding:8px 12px;margin-top:8px;
          display:flex;align-items:baseline;gap:14px}
  .banner .w{font-size:17px;font-weight:600;letter-spacing:1.2px;white-space:nowrap}
  .banner .d{font-size:10.5px;color:var(--mid);letter-spacing:.3px}
  .banner.soft{border-width:1px;border-style:dashed}

  .specs{display:flex;gap:26px;flex-wrap:wrap;padding:7px 0;
         border-bottom:1px solid var(--faint);font-size:11px}
  .specs div span{color:var(--mid)}
  .specs div b{font-weight:500}

  /* The SVG is positioned against a definite-height box rather than given
     height:100% as a flex item. A percentage height on a flex item resolves
     against a height the flex algorithm is still computing, which some browsers
     decline to shrink — the drawing then overflows and is CLIPPED by the
     overflow:hidden above instead of scaling down. Absolute inset against a
     position:relative parent always resolves. */
  .draw{flex:1 1 auto;min-height:0;padding:6px 0 0;position:relative}
  svg{position:absolute;top:6px;left:0;right:0;bottom:0;
      width:100%;height:calc(100% - 6px);display:block}

  .result{border-top:1.5px solid var(--ink);margin-top:6px;padding-top:7px;
          display:flex;justify-content:space-between;align-items:baseline;gap:18px}
  .result .verdict{font-size:15px;font-weight:600;letter-spacing:.6px;white-space:nowrap}
  .result .margins{font-size:11px;color:var(--mid);text-align:right}

  .grade{border:1px solid #000;padding:6px 9px;margin:6px 0 0}
.grade-warn{border-width:2px}
.grade-no{border-width:2px;background:#f2f2f2}
.gtitle{font-weight:700;font-size:10px;letter-spacing:.06em}
.gbody{font-size:9px;line-height:1.45;margin-top:3px}
.notes{margin-top:6px;padding-top:5px;border-top:1px solid var(--faint);
         font-size:8.6px;color:var(--mid);line-height:1.48}
  .notes b{color:var(--ink);font-weight:500}
  .foot{margin-top:6px;display:flex;justify-content:space-between;
        font-size:9px;color:var(--light);letter-spacing:.4px}

  @media print{
    body{background:#fff}
    .bar{display:none}
    /* 8.5 x 11 less a 0.5in page margin leaves exactly 7.5 x 10 in of paper. */
    .sheet{box-shadow:none;margin:0;width:7.5in;height:10in;padding:0;overflow:hidden}
    @page{size:letter portrait;margin:0.5in}
  }
</style>
</head>
<body>

<div class="bar">
  <div id="pickers" style="display:contents">
  <div><label>Lot</label><select id="lotSel"></select></div>
  <div><label>Plan</label><select id="planSel"></select></div>
  <div><label>Elevation</label><select id="elevSel"></select></div>
  </div>
  <!-- Garage side sits OUTSIDE #pickers on purpose. #pickers is hidden when the
       lot and plan arrive in the URL, i.e. every time this sheet is opened from
       the map or the finder — and on a locked lot that is exactly when the lock
       badge and the override control need to be visible. -->
  <div id="garWrap"><label>Garage side (facing the house) <span id="garLock"></span></label>
    <div class="seg"><button id="gL" class="on" onclick="setGar('L')">Left</button><button id="gR" onclick="setGar('R')">Right</button></div>
  </div>
  <div id="shiftWrap"><label>Move home forward <span id="shiftLbl">0'-0"</span></label>
    <input id="shiftSl" type="range" min="0" max="0" step="0.5" value="0"
           oninput="setShift(this.value)" style="width:150px;vertical-align:middle">
  </div>
  <div style="margin-left:auto;display:flex;gap:8px">
    <button onclick="history.length>1?history.back():location.href='lot-map.html?c='+COMMUNITY">&larr; back to map</button>
    <button onclick="window.print()">Print / Save as PDF</button>
  </div>
</div>

<div class="sheet" id="sheet"></div>

<script>
/* =====================================================================
   LOT FIT SHEET — one printable page per lot, drawn as line work.

   Deliberately monochrome: this prints as a plain black-and-white page and
   is meant to read like a plot plan, not a dashboard. Weight carries the
   hierarchy — lot line heaviest, house outline next, setbacks and pad
   dashed and light.

   SURVEY-ACCURATE
     · lot boundary — recorded final plat
     · setbacks and porch encroachment — resolved against City-approved,
       OCH-built plot plans
     · building pad — the engineer's grading drawing, where one exists
     · house outline — traced from the architectural first-floor plan,
       validated against each sheet's own SLAB area
     · garage opening — the overhead door reveal, read from the traced
       outline at the alley face

   APPROXIMATE, AND SAID SO ON THE SHEET
     · driveway apron is drawn square from the door to the alley; the real
       apron is on layer C-DRIV of the grading set and has not been extracted
     · where no traced outline exists the home falls back to a plain
       rectangle at its overall width and depth

   A sales conversation aid. Not a plot plan, not a permit document.
   ===================================================================== */

/* Printed in the footer so you can tell at a glance which file is actually
   live on the site. Bump it whenever this file changes. */
const SHEET_BUILD='2026-10-26a';
/* Per-lot driveway grade, keyed block-lot. Empty where not measured. */
let GRADE={};

const QS=new URLSearchParams(location.search);
const COMMUNITY=QS.get('c')||'heights-uptown';
/* The map drives this sheet: ?lot=N-12&plan=addison_b&gar=L
   The pickers are a fallback for opening the sheet on its own. */
const WANT_LOT=QS.get('lot'), WANT_PLAN=QS.get('plan');
let MAP=null, ORIENT=null, FOOT=null, PORCH=null, LOT=null, GAR=(QS.get('gar')==='R')?'R':'L';
/* Garage swing lock, keyed block-lot, from data/<community>-swing.json.
   'L'/'R' lock the lot to that side; 'E' is an explicit "either" from the same
   OCH instruction and locks nothing; a lot absent from the file carries no
   instruction. The lock is lot data and beats the ?gar= the map or the finder
   sent, unless ?ovr=1 says the override was deliberate — in which case the
   sheet PRINTS a notice, so an override cannot leave the building unnoticed. */
let SWING={}, SWINGMETA={}, GAROVR=(QS.get('ovr')==='1');
function swingOf(l){ return (l&&SWING&&SWING[l.b+'-'+l.l])||null; }
function lockOf(l){ const s=swingOf(l); return (s==='L'||s==='R')?s:null; }
/* Settle GAR against this lot's lock. Called on load and on every lot change. */
function applyLock(){
  const lk=lockOf(LOT);
  if(!lk){ GAROVR=false; return; }
  if(!GAROVR) GAR=lk;
  else if(GAR===lk) GAROVR=false;
}
/* How far forward of the graded pad's rear edge the home is sited, in feet.
   The pad is flat at one elevation, so moving the home forward leaves the
   garage apron and the alley untouched and lengthens the driveway foot for
   foot — a gentler drive and a shorter back yard. Travel is capped at the
   depth margin, which already allows the porch to overhang the front building
   line. This community's rear rule is a drive of 3' or of 20' and over, so a
   longer drive stays compliant. */
let SHIFT=0, MAXSHIFT=0;
function setShift(v){ SHIFT=Math.max(0,Math.min(MAXSHIFT,parseFloat(v)||0)); draw(); }

/* =====================================================================
   COMMUNITY STANDARDS — confirmed 9/28/26, not yet in the data files.
   MUST MATCH the STANDARDS_PATCH block in lot-map.html. When these move
   into the JSON meta blocks, delete them from BOTH files together.
   ===================================================================== */
const STANDARDS_PATCH={
  'heights-uptown':{ maxGradeApproval:12.0 },
  'grandoaks-1a':  { maxGradeApproval:12.0, sideInterior:5.0, sideCorner:15.0, rearBL:20.0 },
  'grandoaks-1b':  { maxGradeApproval:12.0, sideInterior:5.0, sideCorner:15.0 }
};

const F=v=>v==null?'—':(Math.round(v*10)/10).toFixed(1)+"'";
const FT=v=>{if(v==null)return '—';const f=Math.floor(v),i=Math.round((v-f)*12);
  return i===0?f+"'-0\"":(i===12?(f+1)+"'-0\"":f+"'-"+i+'"');};

/* ---------- geometry ---------- */
const sub=(a,b)=>[a[0]-b[0],a[1]-b[1]];
const mid=e=>[(e[0][0]+e[1][0])/2,(e[0][1]+e[1][1])/2];
function centroid(p){let A=0,cx=0,cy=0;
  for(let i=0;i<p.length;i++){const [x0,y0]=p[i],[x1,y1]=p[(i+1)%p.length];
    const c=x0*y1-x1*y0;A+=c;cx+=(x0+x1)*c;cy+=(y0+y1)*c;}
  if(Math.abs(A)<1e-9){const n=p.length;
    return [p.reduce((s,q)=>s+q[0],0)/n,p.reduce((s,q)=>s+q[1],0)/n];}
  A*=0.5;return [cx/(6*A),cy/(6*A)];}
function rot(p,a,o){const c=Math.cos(a),s=Math.sin(a),dx=p[0]-o[0],dy=p[1]-o[1];
  return [o[0]+dx*c-dy*s, o[1]+dx*s+dy*c];}

/* ---------- front-edge resolution ----------
   The orient file records a `front` segment per lot. On rectangular lots it is
   reliable. On irregular lots — corner lots with a clipped corner, lots on a
   curve — the derivation has in several cases tagged a SIDE line as the
   frontage. L-17 (517 Banks Street) records a 110.2' front on a lot whose plat
   frontage is 60.9'; 110.2' is its west side line. Rotating that to horizontal
   lays the lot on its side and draws a confidently wrong plan, which on a sheet
   headed to a buyer is the worst failure this tool has.

   The plat gives an independent check: lot.lw IS the frontage width. So the
   recorded segment is scored against lw, and where it plainly disagrees the
   frontage is re-read from the polygon itself. At L-17 exactly one chord
   matches — C->E at 60.9' — and that is the Banks Street frontage, bent around
   the clipped corner at D.

   Where the check cannot be made confidently the sheet REFUSES to draw rather
   than draw something wrong. Nine lots in this community carry irregular:true
   and several of them record a side line as the frontage. */
function chords(pts){
  const n=pts.length, out=[];
  for(let i=0;i<n;i++) for(let k=1;k<n;k++){
    const a=pts[i], b=pts[(i+k)%n];
    out.push({a:a,b:b,len:Math.hypot(b[0]-a[0],b[1]-a[1]),
              mx:(a[0]+b[0])/2, my:(a[1]+b[1])/2});
  }
  return out;
}
/* ---------- frontage from the engineer's pad ----------
   The plat polygon cannot always settle the frontage. N-5 (500 Callum Parkway)
   is a wedge lot on a curve: its recorded 86.7' plat frontage matches no chord
   of the polygon at all — the nearest is out by 13.4' — because the frontage is
   measured along an arc. The chord search finds nothing, falls back to the
   recorded segment, and that segment is the 111.0' east SIDE line, so the lot
   is drawn lying on its side.

   The engineer's pad settles it. It is a rectangle placed on the lot with its
   LONG axis running street to alley, so it fixes the depth direction exactly —
   no chord matching and no guessing which edge is which.

   Which END is the street comes from where the pad sits along that axis: a
   correctly placed pad is about frontBL off the street and at least rearBL off
   the alley. That pattern has to hold at one end and NOT the other. If both
   ends look alike the pad cannot tell us which way round the lot is, and
   guessing would put the garage on the street — so it declines instead.

   Checked against three lots: N-5 comes out 86.7 x 111.4 against a plat of
   86.7 x 111.4, K-21 74.1 x 116.0 against 74.0 x 116.0, and L-17 60.9 x 111.9
   against 60.9 x 111.8 — the last of those closer to the plat than the chord
   search manages. */
/* ---------- frontage resolution, scored against the plat ----------
   Earlier builds were a cascade of special cases — trust the recorded segment,
   else hunt for a matching chord, else fall back to the pad — and every new lot
   shape added another branch. This asks one question instead:

     of the directions available, which one reproduces the plat's own
     lw x ld when the lot is laid out on the page?

   The plat dimensions are what every branch was really reaching for, so using
   them directly is simpler and much harder to fool. Candidates are the recorded
   segment, every chord of the polygon near the plat frontage, and the
   perpendicular to the engineer's graded pad. Lowest error wins.

   Direction and END are separate questions. Scoring settles direction only — a
   lot turned through 180 degrees scores identically. The end comes from the
   pad's own setbacks where they are decisive (about frontBL off the street, at
   least rearBL off the alley) and otherwise from where the recorded frontage
   sits.

   Checked against all 24 Heights lots the audit flagged: every one lands within
   0.4 ft of its recorded plat dimensions with the street at the bottom. The
   lots this fixed — 529, 505 and 501 Callum Parkway — were out by 7.7, 26.8 and
   33.1 ft under the previous scheme. */
function lotBox(pts,ux,uy){
  const px=-uy,py=ux;
  let x0=Infinity,x1=-Infinity,y0=Infinity,y1=-Infinity;
  for(let i=0;i<pts.length;i++){
    const a=pts[i][0]*px+pts[i][1]*py, b=pts[i][0]*ux+pts[i][1]*uy;
    if(a<x0)x0=a; if(a>x1)x1=a; if(b<y0)y0=b; if(b>y1)y1=b;
  }
  return {w:x1-x0,d:y1-y0,lo:y0,hi:y1};
}
function padUnit(lot){
  const pad=lot.pad; if(!pad||pad.length<4)return null;
  let best=null;
  for(let i=0;i<pad.length;i++){
    const a=pad[i],b=pad[(i+1)%pad.length];
    const L=Math.hypot(b[0]-a[0],b[1]-a[1]);
    if(!best||L>best.L)best={L:L,ux:(b[0]-a[0])/L,uy:(b[1]-a[1])/L};
  }
  return (best&&best.L>=20)?best:null;
}
function resolveFront(lot,orient,frontBL,rearBL){
  const rec=orient&&orient.front;
  const lw=lot.lw, ld=lot.ld;
  if(!rec&&!(lot.pad&&lot.pad.length))
    return {ok:false,code:'NO RECORD',why:'this lot has neither a recorded frontage nor a graded pad, so there is nothing to orient it by'};

  const cands=[];
  /* No dedupe. Near-parallel candidates differ by a fraction of a degree, which
     is a foot over a 110 ft lot; merging them threw that away and kept whichever
     happened to be added first. Scoring picks the better one. */
  const add=(ux,uy,src)=>{ if(isFinite(ux)&&isFinite(uy)&&cands.length<400) cands.push({ux:ux,uy:uy,src:src}); };
  if(rec){ const vx=rec[1][0]-rec[0][0], vy=rec[1][1]-rec[0][1], L=Math.hypot(vx,vy);
           if(L>1) add(-vy/L,vx/L,'recorded'); }
  const pu=padUnit(lot); if(pu) add(pu.ux,pu.uy,'pad');
  if(lw!=null){
    const n=lot.pts.length, tol=Math.max(3,lw*0.08);
    for(let i=0;i<n;i++) for(let k=1;k<n;k++){
      const a=lot.pts[i], b=lot.pts[(i+k)%n], L=Math.hypot(b[0]-a[0],b[1]-a[1]);
      if(L>1&&Math.abs(L-lw)<=tol) add(-(b[1]-a[1])/L,(b[0]-a[0])/L,'chord');
    }
  }
  if(!cands.length)
    return {ok:false,code:'NO DIRECTION',guess:rec,why:'nothing in the data gives a usable frontage direction for this lot'};

  for(let i=0;i<cands.length;i++){
    const c=cands[i]; c.bb=lotBox(lot.pts,c.ux,c.uy);
    c.score=(lw!=null?Math.abs(c.bb.w-lw):0)+(ld!=null?Math.abs(c.bb.d-ld):0);
  }
  cands.sort((a,b)=>a.score-b.score);
  const win=cands[0];
  const pr=q=>q[0]*win.ux+q[1]*win.uy;

  let street=null, endSrc='';
  if(pu&&lot.pad){
    const padP=lot.pad.map(pr);
    const gapLo=Math.min.apply(null,padP)-win.bb.lo, gapHi=win.bb.hi-Math.max.apply(null,padP);
    const fits=(g,o)=>Math.abs(g-frontBL)<=4&&o>=rearBL-4;
    if(fits(gapLo,gapHi)!==fits(gapHi,gapLo)){ street=fits(gapLo,gapHi)?win.bb.lo:win.bb.hi; endSrc='pad'; }
  }
  let recAtStreet=null;
  if(rec){
    const f=pr([(rec[0][0]+rec[1][0])/2,(rec[0][1]+rec[1][1])/2]);
    const nearer=Math.abs(f-win.bb.lo)<=Math.abs(f-win.bb.hi)?win.bb.lo:win.bb.hi;
    if(street===null){ street=nearer; endSrc='recorded'; }
    else recAtStreet=(nearer===street);
  }
  if(street===null)
    return {ok:false,code:'NO END',guess:rec,why:'nothing in the data says which end of this lot faces the street'};

  let anchor=lot.pts[0], bd=Infinity;
  for(let i=0;i<lot.pts.length;i++){ const d=Math.abs(pr(lot.pts[i])-street); if(d<bd){bd=d;anchor=lot.pts[i];} }
  const px=-win.uy, py=win.ux;
  const front=[[anchor[0]-px*10,anchor[1]-py*10],[anchor[0]+px*10,anchor[1]+py*10]];

  let code='OK', why='';
  /* Scoring picks the best direction, but on a plain rectangular lot the
     recorded frontage and the pad's perpendicular are the same line to within a
     rounding error, and whichever wins by a hair gets reported. That produced
     26 lots carrying "the recorded frontage does not lay the lot out to its
     platted dimensions" when it laid it out to within 0.1 ft. Only say the
     recorded frontage was wrong when it was MATERIALLY wrong. */
  let recScore=null;
  for(let i=0;i<cands.length;i++) if(cands[i].src==='recorded'&&(recScore===null||cands[i].score<recScore)) recScore=cands[i].score;
  const recMateriallyWorse = recScore!=null && (recScore-win.score)>1.0;
  const recMissing = recScore===null;

  if(recAtStreet===false){
    code='TURNED ROUND';
    why='the frontage recorded for this lot sits at the ALLEY end. The engineer\'s graded pad places the street at the opposite end, so the lot has been turned round — it was previously drawn with the garage facing the street.';
  } else if(win.src==='pad'&&(recMateriallyWorse||recMissing)){
    code='PAD-DERIVED';
    why='the frontage recorded for this lot does not lay the lot out to its platted '+(lw!=null?lw.toFixed(1)+"' x "+ld.toFixed(1)+"'":'dimensions')+' — it is out by '+(recMissing?'an unknown amount':(recScore-win.score).toFixed(1)+"'")+'. The street-to-alley direction has been taken from the engineer\'s graded pad, which reproduces them.';
  } else if(win.src==='chord'&&(recMateriallyWorse||recMissing)){
    code='RE-READ';
    why='the frontage recorded for this lot does not match the plat, so it has been re-read from the plat polygon.';
  }
  if(win.score>6){
    code='POOR FIT';
    why=(why?why+' ':'')+'The lot lays out '+win.bb.w.toFixed(1)+"' x "+win.bb.d.toFixed(1)+"' against a plat of "+(lw!=null?lw.toFixed(1):'?')+"' x "+(ld!=null?ld.toFixed(1):'?')+"' — the plat and the polygon disagree about this lot.";
  }
  return {ok:true,front:front,src:win.src,endSrc:endSrc,code:code,why:why,
          pageW:win.bb.w,pageD:win.bb.d,score:win.score};
}

/* Rotate the lot so the frontage is horizontal with the street at the bottom
   and the alley at the top. Returns the angle too, so a north arrow can be
   drawn correctly on a sheet whose orientation is no longer the map's. */
function orientLot(lot,orient,frontSeg){
  const fr=frontSeg||orient.front, o=centroid(lot.pts);
  const v=sub(fr[1],fr[0]);
  let a=-Math.atan2(v[1],v[0]);
  let pts=lot.pts.map(p=>rot(p,a,o));
  let f=fr.map(p=>rot(p,a,o));
  if(mid(f)[1] < centroid(pts)[1]){ a+=Math.PI;
    pts=lot.pts.map(p=>rot(p,a,o)); f=fr.map(p=>rot(p,a,o)); }
  return {pts:pts, front:f, angle:a, origin:o};
}

/* The overhead door position. footprints.json now carries it explicitly per plan
   — Pearl's came out of the CAD file exactly, the rest off the door recess in
   each traced outline. The recess reading is kept as a fallback so a plan added
   without a door field still draws something sensible rather than nothing.
   This is what makes the left/right choice mean something rather than just
   mirroring the shape. */
function garageOpening(fp){
  if(!fp)return null;
  if(fp.door&&fp.door.lo!=null&&fp.door.hi!=null){
    const w=fp.door.hi-fp.door.lo;
    if(w>=12&&w<=20)return {lo:fp.door.lo,hi:fp.door.hi,w:w,src:fp.door.source||'plan data'};
  }
  if(!fp.pts)return null;
  const near=fp.pts.filter(q=>q[1]>0.2&&q[1]<1.6);
  if(near.length<2)return null;
  const xs=near.map(q=>q[0]);
  const lo=Math.min(...xs), hi=Math.max(...xs);
  const w=hi-lo;
  if(w<12||w>20)return null;          /* not a plausible door — do not guess */
  return {lo:lo,hi:hi,w:w,src:'inferred from the outline'};
}

/* ---------- boot ---------- */
async function boot(){
  const [m,o,f,g,sw]=await Promise.all([
    /* cache:'no-store' on EVERY data fetch, matching lot-map.html. Without it
       the browser serves a stale copy of a data file after it has been replaced
       on the site, and a hard refresh does not always reach it — the sheet then
       PRINTS old data from a correct file, which is the worst possible failure:
       it looks live and is not. Cost is one small refetch. */
    fetch('../data/'+COMMUNITY+'.json',{cache:'no-store'}).then(r=>r.json()),
    fetch('../data/'+COMMUNITY+'-orient.json',{cache:'no-store'}).then(r=>r.json()).catch(()=>null),
    fetch('../data/footprints.json',{cache:'no-store'}).then(r=>r.json()).catch(()=>null),
    /* Per-lot driveway grade from the engineer's grading plan. Optional: a
       community without this file simply prints no grade block. */
    fetch('../data/'+COMMUNITY+'-grade.json',{cache:'no-store'}).then(r=>r.ok?r.json():null).catch(()=>null),
    /* Garage swing lock. Optional: a community without this file has no locks
       and the garage side stays a free choice, exactly as before. */
    fetch('../data/'+COMMUNITY+'-swing.json',{cache:'no-store'}).then(r=>r.ok?r.json():null).catch(()=>null)
  ]);
  MAP=m; ORIENT=o||{}; FOOT=(f&&f.plans)||{}; PORCH=(f&&f.porchByPlan)||{}; GRADE=g||{};
  SWING=(sw&&sw.locks)||{}; SWINGMETA=(sw&&sw.meta)||{};
  MAP.meta=MAP.meta||{};
  const sp=STANDARDS_PATCH[COMMUNITY]||{};
  Object.keys(sp).forEach(k=>{MAP.meta[k]=sp[k];});

  const lots=MAP.lots.filter(l=>l.addr)
    .sort((a,b)=>a.addr.localeCompare(b.addr,undefined,{numeric:true}));
  const ls=document.getElementById('lotSel');
  lots.forEach(l=>{const op=document.createElement('option');
    op.value=l.b+'-'+l.l; op.textContent=l.addr+'  ·  '+l.b+'-'+l.l; ls.appendChild(op);});
  ls.onchange=()=>{LOT=lots.find(x=>x.b+'-'+x.l===ls.value); SHIFT=0;
    /* An override never carries from one lot to the next. */
    GAROVR=false; applyLock(); syncGarButtons(); fillPlans(); draw();};
  LOT=(WANT_LOT&&lots.find(x=>x.b+'-'+x.l===WANT_LOT))||lots[0];
  if(!LOT){document.getElementById('sheet').innerHTML=
    '<p>No addressed lots in this community, so there is nothing to draw.</p>';return;}
  ls.value=LOT.b+'-'+LOT.l;
  fillPlans();
  if(WANT_PLAN&&PLANNAMES[WANT_PLAN]){
    document.getElementById('planSel').value=PLANNAMES[WANT_PLAN].split(' ')[0];
    fillElevs();
    document.getElementById('elevSel').value=WANT_PLAN;
  }
  applyLock();
  syncGarButtons();
  if(WANT_LOT&&WANT_PLAN) document.getElementById('pickers').style.display='none';
  draw();
}
function offered(){
  const o=MAP.meta.offers;
  if(!o)return [];
  if(Array.isArray(o))return o;
  const pr=LOT?LOT.prod:null;
  return (pr!=null&&o[String(pr)])||Object.values(o).flat();
}
function liveOffered(){
  const retired=MAP.meta.retiredPlans||[];
  return offered().filter(id=>!retired.includes(id));
}
function fillPlans(){
  const fams=[];
  liveOffered().forEach(id=>{const n=PLANNAMES[id];
    if(n){const f=n.split(' ')[0]; if(!fams.includes(f))fams.push(f);}});
  const ps=document.getElementById('planSel'); const keep=ps.value;
  ps.innerHTML=fams.map(f=>`<option ${f===keep?'selected':''}>${f}</option>`).join('');
  ps.onchange=()=>{SHIFT=0; fillElevs(); draw();};
  fillElevs();
}
function fillElevs(){
  const fam=document.getElementById('planSel').value;
  const ids=liveOffered().filter(id=>PLANNAMES[id]&&PLANNAMES[id].split(' ')[0]===fam);
  const es=document.getElementById('elevSel'); const keep=es.value;
  es.innerHTML=ids.map(id=>{const e=PLANNAMES[id].split(' ')[1]||'A';
    return `<option value="${id}" ${id===keep?'selected':''}>${e}</option>`;}).join('');
  es.onchange=()=>{SHIFT=0; draw();};
}
/* On a locked lot, choosing the other side is possible but deliberate: it
   raises the override, which the drawn sheet then prints. Choosing the locked
   side back clears it. On an unlocked lot this behaves exactly as before. */
function setGar(s){
  const lk=lockOf(LOT);
  if(lk) GAROVR=(s!==lk);
  GAR=s; syncGarButtons(); draw();
}
function restoreLock(){ const lk=lockOf(LOT); if(lk){GAR=lk; GAROVR=false;} syncGarButtons(); draw(); }
function syncGarButtons(){
  const lk=lockOf(LOT), raw=swingOf(LOT);
  const gl=document.getElementById('gL'), gr=document.getElementById('gR'),
        tag=document.getElementById('garLock');
  if(!gl||!gr) return;
  gl.classList.toggle('on',GAR==='L');
  gr.classList.toggle('on',GAR==='R');
  gl.classList.toggle('ovr',!!(lk&&GAROVR&&GAR==='L'));
  gr.classList.toggle('ovr',!!(lk&&GAROVR&&GAR==='R'));
  if(!tag) return;
  if(lk&&!GAROVR) tag.innerHTML='<b class="lockOn">locked '+(lk==='L'?'left':'right')+'</b>';
  else if(lk&&GAROVR) tag.innerHTML='<b class="lockOvr">override &mdash; locked '+(lk==='L'?'left':'right')
      +'</b> <button class="mini" onclick="restoreLock()">restore</button>';
  else if(raw==='E') tag.innerHTML='<b class="lockEither">either side</b>';
  else tag.innerHTML='';
}

/* ---------- plan dimensions ----------
   SECOND COPY of the plan library — lot-map.html holds the other. Keep them in
   step; the proper fix is a shared data/plans.json read by both. The check in
   unknownPlans() below at least makes drift visible instead of silent. */
const PLANNAMES={}, PLANDIMS={};
[['addison_a','Addison A',34.833,84.5],['addison_b','Addison B',34.833,84.5],['addison_c','Addison C',34.833,81.5],
 ['carmichael_a','Carmichael A',34.833,82.5],['carmichael_b','Carmichael B',34.833,82.5],['carmichael_c','Carmichael C',34.833,82.5],
 ['crowder_a','Crowder A',30,80],['crowder_b','Crowder B',30,80],['crowder_c','Crowder C',30,80],
 ['holland_a','Holland A',34.833,76.5],['holland_b','Holland B',34.833,77.5],['holland_c','Holland C',34.833,76.5],
 ['knox_a','Knox A',34.917,74.5],['knox_b','Knox B',34.917,74.5],['knox_c','Knox C',34.917,77.5],
 ['parker_a','Parker A',34.833,83.0000],['parker_b','Parker B',34.833,81.0833],['parker_c','Parker C',34.833,81.5833],
 ['pearl_a','Pearl A',29.917,79.917]
].forEach(([id,n,w,d])=>{PLANNAMES[id]=n;PLANDIMS[id]={w,d};});
function unknownPlans(){ return offered().filter(id=>!PLANNAMES[id]); }

/* ---------- drawing primitives: plain line work ---------- */
const NSVG=[];
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');}
/* architectural tick: a short 45-degree slash at each end of a dimension line */
function tick(x,y,vertical){
  const d=3.1;
  return vertical
    ? `<line x1="${x-d}" y1="${y+d}" x2="${x+d}" y2="${y-d}" stroke="#333" stroke-width=".9"/>`
    : `<line x1="${x-d}" y1="${y+d}" x2="${x+d}" y2="${y-d}" stroke="#333" stroke-width=".9"/>`;
}
function dimH(x1,x2,y,label,extFrom){
  if(Math.abs(x2-x1)<14)return '';
  let s=`<line x1="${x1}" y1="${y}" x2="${x2}" y2="${y}" stroke="#333" stroke-width=".7"/>`;
  s+=tick(x1,y)+tick(x2,y);
  if(extFrom!=null){
    s+=`<line x1="${x1}" y1="${extFrom}" x2="${x1}" y2="${y+(y>extFrom?4:-4)}" stroke="#999" stroke-width=".5"/>`;
    s+=`<line x1="${x2}" y1="${extFrom}" x2="${x2}" y2="${y+(y>extFrom?4:-4)}" stroke="#999" stroke-width=".5"/>`;
  }
  const cx=(x1+x2)/2, w=String(label).length*5.6+6;
  s+=`<rect x="${cx-w/2}" y="${y-6.5}" width="${w}" height="13" fill="#fff"/>`;
  s+=`<text x="${cx}" y="${y+3.4}" text-anchor="middle" font-family="Calibri, Segoe UI, system-ui, sans-serif" font-size="9" fill="#000">${esc(label)}</text>`;
  return s;
}
function dimV(y1,y2,x,label,extFrom){
  if(Math.abs(y2-y1)<14)return '';
  let s=`<line x1="${x}" y1="${y1}" x2="${x}" y2="${y2}" stroke="#333" stroke-width=".7"/>`;
  s+=tick(x,y1,true)+tick(x,y2,true);
  if(extFrom!=null){
    s+=`<line x1="${extFrom}" y1="${y1}" x2="${x+(x>extFrom?-4:4)}" y2="${y1}" stroke="#999" stroke-width=".5"/>`;
    s+=`<line x1="${extFrom}" y1="${y2}" x2="${x+(x>extFrom?-4:4)}" y2="${y2}" stroke="#999" stroke-width=".5"/>`;
  }
  const cy=(y1+y2)/2, w=String(label).length*5.6+6;
  s+=`<g transform="translate(${x},${cy}) rotate(-90)">`
   + `<rect x="${-w/2}" y="-6.5" width="${w}" height="13" fill="#fff"/>`
   + `<text x="0" y="3.4" text-anchor="middle" font-family="Calibri, Segoe UI, system-ui, sans-serif" font-size="9" fill="#000">${esc(label)}</text></g>`;
  return s;
}
function note(x,y,txt,anchor){
  return `<text x="${x}" y="${y}" text-anchor="${anchor||'middle'}" font-family="Calibri, Segoe UI, system-ui, sans-serif" `
       + `font-size="8.2" fill="#555" letter-spacing=".4">${esc(txt)}</text>`;
}

/* ---------- draw ---------- */
function draw(){
  if(!LOT)return;
  const key=LOT.b+'-'+LOT.l;
  const or=ORIENT[key];
  const pid=document.getElementById('elevSel').value;
  const plan=PLANDIMS[pid], pname=PLANNAMES[pid]||'—';
  const M=MAP.meta;
  const fbl=M.frontBL!=null?M.frontBL:10, rear=M.rearBL!=null?M.rearBL:20,
        sideI=M.sideInterior!=null?M.sideInterior:5,
        porch=M.porchEncroach!=null?M.porchEncroach:5;
  const maxg=M.maxGrade!=null?M.maxGrade:10;
  const ceil=M.maxGradeApproval!=null?M.maxGradeApproval:maxg;

  let svg='<p style="font-size:11px;color:#555">Lot orientation is not recorded for this lot, so the plan cannot be drawn to scale. The figures below still apply.</p>';
  let dm=null, wm=null, traced=false, doorFound=false, fpKey=null, rearClamp=0;
  let frontNote='', drawBlocked=null, fp=null;

  const FR = or ? resolveFront(LOT,or,fbl,rear) : null;
  if(FR&&!FR.ok) drawBlocked=FR.why;
  if(FR&&FR.ok&&FR.why) frontNote=FR.why;

  /* ---------- the fit figures ----------
     Computed HERE, before and outside the drawing, and from the plat and pad
     numbers only — never from the rotated lot outline. They used to be worked
     out inside the drawing block, which meant a lot whose drawing was refused
     printed NOT CHECKED with empty margins while the refusal notice directly
     above it claimed the figures were unaffected. They are two independent
     questions: whether the home fits, and whether we can draw where it sits.
     K-21 is the case in point — 19 plans fit it and the sheet said nothing. */
  const availW = (LOT.padW!=null) ? LOT.padW
               : (M.buildableWidth!=null) ? M.buildableWidth
               : (LOT.lw!=null) ? LOT.lw-sideI*2 : null;
  if(plan&&availW!=null) wm=availW-plan.w;

  /* The porch credit is PER PLAN. Only a porch may project into the front
     building line — living space never can — and whether a plan has one is a
     property of the ELEVATION, decided by whether there is living space above
     the front door. `porch` from the community meta is the CAP (5' at Celina,
     and nothing more), not the entitlement.

     All 19 elevations were confirmed against the elevation drawings on 13-14 Oct
     2026. An elevation missing from the table falls back to the community figure
     and is flagged on the sheet as unconfirmed.

     The figure lives in ONE place — `porchByPlan` in footprints.json, keyed by
     elevation — deliberately not beside the geometry. Addison's three elevations
     share one floor plan but NOT one porch (A and B project 7', C only 4'), so a
     porch attached to the footprint would sit at the wrong level and Addison C
     would silently inherit A's. See claude/porch-encroachment-per-plan.md. */
  const projection = (PORCH && pid && PORCH[pid]!=null) ? PORCH[pid] : null;
  const porchKnown = projection!=null;
  const credit = porchKnown ? Math.min(projection,porch) : porch;

  if(plan){
    if(LOT.padD!=null)      dm=LOT.padD-(plan.d-credit);
    else if(LOT.ld!=null)   dm=LOT.ld-(plan.d+fbl+rear-credit);
    /* Forward travel is exactly the depth this plan does not use. */
    MAXSHIFT = (dm!=null && dm>0) ? Math.round(dm*2)/2 : 0;
    if(SHIFT>MAXSHIFT) SHIFT=MAXSHIFT;
    (function(){
      const sl=document.getElementById('shiftSl'), lb=document.getElementById('shiftLbl'),
            wrap=document.getElementById('shiftWrap');
      if(!sl) return;
      wrap.style.display = MAXSHIFT>0 ? '' : 'none';
      sl.max=MAXSHIFT; sl.value=SHIFT; lb.textContent=F(SHIFT)+' of '+F(MAXSHIFT);
    })();
  }

  if(or&&!drawBlocked){
    const O=orientLot(LOT,or,FR.front);
    const xs=O.pts.map(p=>p[0]), ys=O.pts.map(p=>p[1]);
    const minx=Math.min(...xs), maxx=Math.max(...xs),
          miny=Math.min(...ys), maxy=Math.max(...ys);
    const lotW=maxx-minx, lotD=maxy-miny;

    /* Second, independent check: once rotated, the depth down the page must be
       the plat depth. If it is not, the lot is still lying the wrong way round
       and nothing below this point can be trusted. */
    if(LOT.ld!=null&&Math.abs(lotD-LOT.ld)>Math.max(4.0,LOT.ld*0.10))
      drawBlocked=`with the frontage as resolved, the lot measures ${lotD.toFixed(1)}' from street to alley but the plat records ${LOT.ld.toFixed(1)}'`;
  }

  /* These sheets are preliminary and are always followed by a surveyed plot plan
     before anything is committed, so an empty box serves nobody — an approximate
     drawing carrying a visible caveat tells you more. The sheet therefore draws
     its best reading of an ambiguous lot and says so at the top, rather than
     refusing. `geomDoubt` carries the reason up to the banner. */
  const geomDoubt = drawBlocked;
  if(drawBlocked && FR && (FR.guess||FR.front)){
    FR.front = FR.front || FR.guess;      /* a depth mismatch still has a frontage */
    drawBlocked = null;
  }

  if(drawBlocked)
    svg='<div style="font-size:11px;color:#000;border:1px solid #000;padding:14px;line-height:1.7">'
      + '<b>THE PLAN IS NOT DRAWN FOR THIS LOT.</b><br>'
      + 'The lot geometry on file does not agree with the recorded plat, so any '
      + 'drawing made from it would be wrong: ' + esc(drawBlocked) + '.<br><br>'
      + 'This says nothing about whether the home fits. The verdict and margins '
      + 'below come from the engineer\'s pad and the plan dimensions, which do '
      + 'not depend on the lot outline, and they still stand. What is missing is '
      + 'the picture of where the home sits. Correct this lot\'s frontage in the '
      + 'orientation data to restore it.</div>';

  if(or&&!drawBlocked){
    const O=orientLot(LOT,or,FR.front);
    const xs=O.pts.map(p=>p[0]), ys=O.pts.map(p=>p[1]);
    const minx=Math.min(...xs), maxx=Math.max(...xs),
          miny=Math.min(...ys), maxy=Math.max(...ys);
    const lotW=maxx-minx, lotD=maxy-miny;

    /* generous margins: the dimension strings live outside the lot */
    const W=612, ML=62, MR=58, MT=34, MB=44;
    const avail=W-ML-MR, availH=660;
    const sc=Math.min(avail/lotW, availH/lotD);
    const H=Math.round(lotD*sc+MT+MB);
    const ox=ML+(avail-lotW*sc)/2, oy=MT;
    const X=x=>ox+(x-minx)*sc, Y=y=>oy+(y-miny)*sc, S=v=>v*sc;

    const frontY=maxy, rearY=miny;
    const poly=O.pts.map(p=>X(p[0])+','+Y(p[1])).join(' ');

    /* meet, not slice: the whole drawing is scaled uniformly into whatever box
       the page leaves, so nothing is ever cropped and the graphic scale bar
       below stays truthful at any size. */
    let s=`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">`;
    s+=`<rect width="${W}" height="${H}" fill="#fff"/>`;

    /* --- lot boundary: the heaviest line on the sheet --- */
    s+=`<polygon points="${poly}" fill="none" stroke="#000" stroke-width="1.7" stroke-linejoin="round"/>`;

    /* --- setback lines, dashed and labelled in place --- */
    const sbl=(x1,y1,x2,y2)=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#777" stroke-width=".8" stroke-dasharray="7,4"/>`;
    s+=sbl(X(minx),Y(frontY-fbl),X(maxx),Y(frontY-fbl));
    s+=sbl(X(minx),Y(rearY+rear),X(maxx),Y(rearY+rear));
    s+=sbl(X(minx+sideI),Y(rearY),X(minx+sideI),Y(frontY));
    s+=sbl(X(maxx-sideI),Y(rearY),X(maxx-sideI),Y(frontY));
    s+=note(X(minx)+7,Y(frontY-fbl)-4,fbl+"' B.L.",'start');
    s+=note(X(minx)+7,Y(rearY+rear)+10,rear+"' B.L. TO ALLEY",'start');
    s+=note(X(minx+sideI)+3,Y(rearY)+S(lotD/2),'',"start");
    s+=`<g transform="translate(${X(minx+sideI)-4},${Y(rearY+lotD*0.32)}) rotate(-90)">`
      +`<text x="0" y="0" text-anchor="middle" font-family="Calibri, Segoe UI, system-ui, sans-serif" font-size="8.2" fill="#555">${sideI}' B.L.</text></g>`;
    s+=`<g transform="translate(${X(maxx-sideI)+9},${Y(rearY+lotD*0.32)}) rotate(-90)">`
      +`<text x="0" y="0" text-anchor="middle" font-family="Calibri, Segoe UI, system-ui, sans-serif" font-size="8.2" fill="#555">${sideI}' B.L.</text></g>`;

    /* --- engineer's pad, where the grading drawing gave one --- */
    let padPts=null,padL=null,padR=null,padT=null,padB=null;
    if(LOT.pad&&LOT.pad.length){
      padPts=LOT.pad.map(p=>rot(p,O.angle,O.origin));
      padL=Math.min(...padPts.map(p=>p[0])); padR=Math.max(...padPts.map(p=>p[0]));
      padT=Math.min(...padPts.map(p=>p[1])); padB=Math.max(...padPts.map(p=>p[1]));
      s+=`<polygon points="${padPts.map(p=>X(p[0])+','+Y(p[1])).join(' ')}" fill="none"
            stroke="#AAA" stroke-width="1" stroke-dasharray="3,3"/>`;
      s+=note(X(padR)-3,Y(padT)-4,'GRADED PAD','end');
    }

    if(plan){
      /* Footprints are keyed by plan id where the elevations genuinely differ
         (Holland and Knox each have three first-floor plans) and by family where
         A, B and C share one floor plan and only the facade changes. Try the
         elevation first, fall back to the family. */
      const fam=(pname.split(' ')[0]||'').toLowerCase();
      fp=FOOT[pid]||FOOT[fam];
      fpKey = FOOT[pid] ? pid : (FOOT[fam] ? fam : null);
      /* buildable width and depth, best source first */
      /* dm and wm were computed above, from the plat and the pad. Nothing here
         recomputes them — the drawing reads them, it does not define them. */

      /* anchor: rear (garage) face of the house to the alley edge of the pad,
         centred across the pad width. Falls back to the setback envelope.

         THE REAR BUILDING LINE IS A HARD STOP. The engineer's pad is a grading
         limit, not a building envelope, and on some lots it is graded closer to
         the alley than the rear B.L. allows. The house may not follow it there:
         the rear face is clamped to the building line, and the depth the clamp
         costs comes straight off the margin below so the verdict can never be
         flattered by a pad that reaches past the line. `rear` is read from the
         community meta — 20' at The Heights, whatever each community defines. */
      const aL = padL!=null?padL:(minx+lotW/2-plan.w/2);
      const aR = padR!=null?padR:(minx+lotW/2+plan.w/2);
      const blT = rearY+rear;
      let aT = padT!=null?padT:blT;
      if(aT < blT){ rearClamp = blT-aT; aT = blT; }
      /* Slide the home toward the street. y grows away from the alley here, so
         forward travel is added to the rear face. */
      aT += Math.max(0, Math.min(MAXSHIFT, SHIFT));
      /* The margin is NOT penalised by the clamp. dm is computed from padD, the
         pad's DEPTH, and the depth model already assumes a home seated on the
         rear B.L. — at 713 Lincoln Mews padD is 80.0', which is exactly the
         110' lot less the 20' rear and 10' front building lines. A clamp here
         means the pad POLYGON is drawn nearer the alley than its own depth
         implies, which is a placement discrepancy in the pad geometry, not lost
         buildable depth. Docking dm would have turned a built house's +0.5'
         into -10.3'. Flagged in the notes instead. */
      const cx = (aL+aR)/2;

      let houseL,houseR,houseFrontY;
      if(fp&&fp.pts&&fp.pts.length>3){
        traced=true;
        /* LEFT and RIGHT are read standing at the street looking at the house.
           The sheet draws street at the bottom, alley at the top, so a viewer at
           the street faces up the page and their left is the page's left.
           Every plan is DRAWN with its garage on the high-x side, which is the
           page's right — so the CAD plan as drawn is a RIGHT-hand garage, and it
           is LEFT that mirrors. (The rectangle fallback below already had this
           the right way round; this traced branch did not.) */
        const px=v=>X(cx-fp.w/2+(GAR==='L'?(fp.w-v):v));
        const py=v=>Y(aT+v);
        s+=`<polygon points="${fp.pts.map(p=>px(p[0])+','+py(p[1])).join(' ')}"
              fill="none" stroke="#000" stroke-width="1.35" stroke-linejoin="round"/>`;
        houseL=cx-fp.w/2; houseR=cx+fp.w/2; houseFrontY=aT+fp.d;

        /* the overhead door, from the trace */
        const g=garageOpening(fp);
        if(g){
          doorFound=true;
          const gl=GAR==='L'?(fp.w-g.hi):g.lo, gh=GAR==='L'?(fp.w-g.lo):g.hi;
          const gx1=X(cx-fp.w/2+gl), gx2=X(cx-fp.w/2+gh);
          /* door shown as a heavy segment on the alley face */
          s+=`<line x1="${gx1}" y1="${Y(aT)}" x2="${gx2}" y2="${Y(aT)}" stroke="#000" stroke-width="3.4"/>`;
          /* apron, door to alley */
          s+=`<line x1="${gx1}" y1="${Y(aT)}" x2="${gx1}" y2="${Y(rearY)}" stroke="#777" stroke-width=".8" stroke-dasharray="4,3"/>`;
          s+=`<line x1="${gx2}" y1="${Y(aT)}" x2="${gx2}" y2="${Y(rearY)}" stroke="#777" stroke-width=".8" stroke-dasharray="4,3"/>`;
          s+=note((gx1+gx2)/2,Y(rearY)+S(rear)/2+3,'DRIVE');
          s+=dimH(gx1,gx2,Y(aT)-13,FT(g.w),null);
          s+=note((gx1+gx2)/2,Y(aT)-19,'16\'-0" O.H. DOOR — GARAGE '+(GAR==='L'?'LEFT':'RIGHT'));
        }
      } else {
        /* no traced outline for this plan — plain rectangle, stated in the notes */
        const hw=S(plan.w), hd=S(plan.d);
        const hx=X(cx)-hw/2, hy=Y(aT);
        s+=`<rect x="${hx}" y="${hy}" width="${hw}" height="${hd}" fill="none" stroke="#000" stroke-width="1.35"/>`;
        houseL=cx-plan.w/2; houseR=cx+plan.w/2; houseFrontY=aT+plan.d;
        const gw=hw*0.46, gx=(GAR==='L')?hx+hw*0.05:hx+hw-gw-hw*0.05;
        s+=`<line x1="${gx}" y1="${hy}" x2="${gx+gw}" y2="${hy}" stroke="#000" stroke-width="3.4"/>`;
        s+=note(gx+gw/2,hy-6,'GARAGE (INDICATIVE)');
      }

      /* --- dimensions --- */
      const dimTop=Y(rearY)-16;
      s+=dimH(X(houseL),X(houseR),dimTop,FT(plan.w),Y(rearY));
      s+=dimV(Y(aT),Y(houseFrontY),X(maxx)+30,FT(plan.d),X(maxx));
      /* side clearances, house to lot line */
      if(houseL-minx>1.5) s+=dimH(X(minx),X(houseL),Y(houseFrontY)+15,FT(houseL-minx),Y(houseFrontY));
      if(maxx-houseR>1.5) s+=dimH(X(houseR),X(maxx),Y(houseFrontY)+15,FT(maxx-houseR),Y(houseFrontY));
      /* front face to front lot line */
      if(frontY-houseFrontY>1.5)
        s+=dimV(Y(houseFrontY),Y(frontY),X(minx)-18,FT(frontY-houseFrontY),X(minx));
    }

    /* --- overall lot dimensions, outermost --- */
    s+=dimH(X(minx),X(maxx),Y(frontY)+30,FT(lotW),Y(frontY));
    s+=dimV(Y(rearY),Y(frontY),X(maxx)+52,FT(lotD),X(maxx));

    /* --- edge labels --- */
    s+=note(W/2,Y(rearY)-24,'ALLEY');
    s+=note(W/2,Y(frontY)+46,(LOT.street||'STREET').toUpperCase());

    /* --- north arrow, only where the source frame states its orientation --- */
    if(/north is up/i.test(M.orientation||'')){
      const nx=W-26, ny=MT+16, L=15;
      const dx=Math.sin(O.angle)*L, dy=-Math.cos(O.angle)*L;
      s+=`<line x1="${nx-dx}" y1="${ny-dy}" x2="${nx+dx}" y2="${ny+dy}" stroke="#000" stroke-width="1"/>`;
      s+=`<circle cx="${nx+dx}" cy="${ny+dy}" r="2.1" fill="#000"/>`;
      s+=`<text x="${nx+dx*1.75}" y="${ny+dy*1.75+3}" text-anchor="middle" font-family="Calibri, Segoe UI, system-ui, sans-serif" font-size="8.5" fill="#000">N</text>`;
    }

    /* --- graphic scale: correct whatever the printer does --- */
    const sbFt=20, sbx=ML-4, sby=H-13, sbw=S(sbFt);
    s+=`<line x1="${sbx}" y1="${sby}" x2="${sbx+sbw}" y2="${sby}" stroke="#000" stroke-width="1"/>`;
    s+=`<line x1="${sbx}" y1="${sby-3.5}" x2="${sbx}" y2="${sby+3.5}" stroke="#000" stroke-width="1"/>`;
    s+=`<line x1="${sbx+sbw/2}" y1="${sby-2.5}" x2="${sbx+sbw/2}" y2="${sby+2.5}" stroke="#000" stroke-width=".8"/>`;
    s+=`<line x1="${sbx+sbw}" y1="${sby-3.5}" x2="${sbx+sbw}" y2="${sby+3.5}" stroke="#000" stroke-width="1"/>`;
    s+=note(sbx,sby+13,'0','middle')+note(sbx+sbw,sby+13,sbFt+" FT",'middle');
    s+='</svg>';
    svg=s;
  }

  /* Whether a plan was actually drawn. The notes below describe the drawing,
     so on a refused sheet most of them would be describing something that is
     not on the page. */
  const DRAWN = !drawBlocked && !!or;

  /* --- the banner, directly under the address ---
     Two separate facts, never merged. DOES NOT FIT means the margins are
     negative; the home will not go on this pad. GEOMETRY UNVERIFIED means the
     lot outline on file disagrees with the plat, so the drawing is approximate —
     it says nothing about fit, and a lot can carry it while fitting comfortably.
     812 Garrett was exactly that: undrawable, and 19 plans fit it. */
  let banner='';
  const bnr=(w,d,soft)=>`<div class="banner${soft?' soft':''}"><div class="w">${w}</div><div class="d">${d}</div></div>`;

  /* --- verdict, in words rather than colour --- */
  let verdict='NOT CHECKED', detail='';
  if(dm!=null&&wm!=null){
    if(dm<0||wm<0){
      verdict='DOES NOT FIT';
      detail=[dm<0?`short ${Math.abs(dm).toFixed(1)}' on depth`:null,
              wm<0?`short ${Math.abs(wm).toFixed(1)}' on width`:null]
             .filter(Boolean).join(' · ');
    } else if(dm<2||wm<0.5){
      verdict='FITS — TIGHT'; detail='confirm against the surveyed plot plan';
    } else { verdict='FITS'; detail=''; }
  }
  if(verdict==='DOES NOT FIT')
    banner+=bnr(esc(pname)+' DOES NOT FIT THIS LOT', esc(detail));
  if(geomDoubt)
    banner+=bnr('GEOMETRY UNVERIFIED — PLAN SHOWN IS APPROXIMATE',
      'The lot outline on file disagrees with the plat, so where the home sits is a best reading, not a measurement. '
      +'This does not affect whether it fits: the figures below come from the pad and plan dimensions. '
      +esc(geomDoubt)+'.', true);

  /* Garage swing. A locked lot is an OCH streetscape instruction, not a
     geometry fact, so it is stated on the printed sheet rather than left in the
     screen controls — and an override is stated in the strongest form the sheet
     has, naming both the locked side and the side actually drawn. A sheet that
     left the building without that line is the failure this guards against. */
  const lkS=lockOf(LOT), rawS=swingOf(LOT);
  if(lkS&&GAR!==lkS)
    banner+=bnr('GARAGE DRAWN ON THE '+(GAR==='L'?'LEFT':'RIGHT')+' — THIS LOT IS LOCKED '+(lkS==='L'?'LEFT':'RIGHT'),
      'The garage swing on this lot is locked to the '+(lkS==='L'?'left':'right')
      +' by OCH. This sheet has been drawn the other way on purpose. '
      +'Do not act on it without confirming the swing. '
      +esc(SWINGMETA.source||'OCH garage swing list')+'.');
  else if(lkS)
    banner+=bnr('GARAGE LOCKED '+(lkS==='L'?'LEFT':'RIGHT'),
      'The garage swing on this lot is set by OCH and is not a choice. Read standing at the street looking at the house. '
      +esc(SWINGMETA.source||'OCH garage swing list')+'.', true);
  else if(rawS==='E')
    banner+=bnr('GARAGE SWING — EITHER SIDE',
      'Either side is allowed on this lot, stated on the OCH garage swing list. '
      +'The side drawn here is a choice, not an instruction.', true);

  /* ONE source for the slope on this page. The grade file is built from the
     engineer's grading plan and the surveyed alley elevations and is the figure
     the block lower down explains. The older LOT.sl21 field disagreed with it
     badly — 3.5 against a verified 13.8 at 708 Garrett, where 3.5 happens to be
     the rise in FEET — so it is no longer printed where a grade record exists.
     A sheet must never show two different slopes for the same driveway. */
  const Ghdr = (GRADE && GRADE[LOT.b+'-'+LOT.l]) || null;
  /* Everything on this page reports the home WHERE IT IS SITTING. Move the
     slider and the drive lengthens, the slope falls and the garage drop needed
     falls with it — headline, banner and figures together. A page that kept
     showing the rear-line numbers while the drawing showed the home somewhere
     else was contradicting itself. */
  const hShift = Math.max(0, Math.min(MAXSHIFT, SHIFT));
  const slopeVal = Ghdr ? (Ghdr.rise/(Ghdr.run+hShift)*100) : null;
  const slopeTxt = slopeVal==null ? 'not measured'
    : slopeVal<=maxg ? slopeVal.toFixed(1)+'%'
    : slopeVal<=ceil ? slopeVal.toFixed(1)+'% — over '+maxg+'%, needs City approval'
    : slopeVal.toFixed(1)+'% — over the '+ceil+'% ceiling, dropped garage';

  const unk=unknownPlans();

  document.getElementById('sheet').innerHTML=`
    <div class="title">
      <div>
        <div class="addr">${esc(LOT.addr||(LOT.b+'-'+LOT.l))}</div>

      </div>

        Depth margin ${dm==null?'—':(dm>=0?'+':'')+dm.toFixed(1)+"'"} &nbsp;·&nbsp;
        Width margin ${wm==null?'—':(wm>=0?'+':'')+wm.toFixed(1)+"'"}${detail?'<br>'+esc(detail):''}
      </div>
    </div>

    ${(function(){
      const G = GRADE && GRADE[LOT.b+'-'+LOT.l];
      if(!G) return '';
      const maxg = M.maxGrade!=null?M.maxGrade:10, ceil = M.maxGradeApproval!=null?M.maxGradeApproval:12;
      const shift = Math.max(0, Math.min(MAXSHIFT, SHIFT));
      const sRun  = G.run + shift;
      const sSlope= sRun>0 ? G.rise/sRun*100 : G.slopePct;
      const over = sSlope>ceil, warn = sSlope>maxg;
      /* Garage drop is recomputed against the CURRENT run, not the rear-line
         run. Moving the home forward is itself a remedy: it buys slope, so it
         reduces the drop still needed. */
      const dropIn = lim => Math.max(0,(G.rise - lim*sRun)*12).toFixed(1);
      /* Grade belongs to the lot, not the plan. Every plan on this lot sees the
         same driveway, because the pad, the alley and the run are all fixed by
         the grading plan. The garage step-down is the only lever. */
      /* The home does not have to sit on the rear building line. This community
         allows a driveway of 3' or of 20' and over; OCH builds to the 20' rule,
         and anything forward of it only makes the drive longer, so it stays
         compliant. The pad is flat at one elevation, so sliding the home
         forward leaves the apron and the alley untouched and lengthens the run
         foot for foot — a gentler drive. How far it can go is the depth margin.
         Slope is therefore a property of the lot AND the plan, not the lot
         alone. */
      return `<div class="grade${over?' grade-no':(warn?' grade-warn':'')}">
        <div class="gtitle">DRIVEWAY ${sSlope.toFixed(1)}%${over?' — DROPPED GARAGE REQUIRED':(warn?' — NEEDS CITY APPROVAL':'')}${shift>0.1?' &middot; HOME '+F(shift)+' FORWARD':''}</div>
        <div class="gbody">
          Pad ${G.padFP.toFixed(2)} &middot; apron ${G.apron.toFixed(2)} &middot; alley ${G.alleyAtDrive.toFixed(2)}
          at the drive &middot; <b>${sRun.toFixed(1)}'</b> run from the rear of the house to the alley
          &middot; fall ${G.rise.toFixed(2)}'.
          ${over ? `About <b>${dropIn(ceil/100)}"</b> of extra garage drop brings this under ${ceil}%, <b>${dropIn(maxg/100)}"</b> under ${maxg}%.`
                 : (warn ? `Within the ${ceil}% the City will approve; ${dropIn(maxg/100)}" of extra drop would bring it under ${maxg}%.`
                         : `No dropped garage needed.`)}
          Assumes the standard 0.84' step-down from top of slab to apron.
          ${shift>0.1
            ? `<br><b>Home sited ${F(shift)} forward</b> of the rear of the pad, of the ${F(MAXSHIFT)}
               this plan allows. On the rear building line it reads ${G.slopePct.toFixed(1)}% and needs
               ${G.dropTo12in}" of drop. That depth comes out of the back yard. The rear rule here is a
               drive of 3' or of 20' and over, so a longer drive stays compliant.`
            : (MAXSHIFT>0.1
               ? `<br>This plan has <b>${F(MAXSHIFT)}</b> of depth to spare. Sliding it fully forward
                  lengthens the drive to ${(G.run+MAXSHIFT).toFixed(1)}', brings the slope to
                  <b>${(G.rise/(G.run+MAXSHIFT)*100).toFixed(1)}%</b> and the drop needed to
                  <b>${Math.max(0,(G.rise-(ceil/100)*(G.run+MAXSHIFT))*12).toFixed(1)}"</b>.` : '')}
        </div></div>`;
    })()}

      encroachment allowed into the front building line.`
      :`<b>The setbacks used for the figures above</b> are the City-approved ones: ${fbl}' front,
      ${rear}' rear to alley, ${sideI}' sides, with a ${porch}' porch encroachment allowed into the
      front building line.`}
      ${porchKnown

        : `<b>The ${porch}' porch encroachment is the community default and has not yet been confirmed for this elevation.</b> Only a projecting porch earns it — living space never can — so this figure may be generous by up to ${porch}'.`}
      ${frontNote?`<b>This lot's recorded frontage disagrees with the plat.</b> ${esc(frontNote)} Worth fixing in the orientation data so the map agrees. `:''}

      ${DRAWN&&rearClamp>0?`<b>The drawn pad outline on this lot sits ${rearClamp.toFixed(1)}' nearer the alley than that line</b>, so the home is held at the line rather than at the pad edge. The depth margin above is unaffected — it is figured from the pad's ${F(LOT.padD)} depth, which already seats the home on the building line. Worth checking the pad geometry for this lot. `:''}

      ${DRAWN&&traced&&fpKey&&fpKey.indexOf('_')>=0?`<b>Outline is elevation ${fpKey.split('_')[1].toUpperCase()}'s own first-floor plan.</b> This plan has a different footprint per elevation. `:''}
      ${DRAWN&&traced&&fp&&fp.d!=null&&plan&&Math.abs(fp.d-plan.d)>0.5
        ? `<b>The drawn outline is ${FT(fp.d)} deep where this elevation is ${FT(plan.d)}.</b> The CAD on file belongs to another elevation — they share a living body and differ at the porch, so the shape is right and the overall depth is not. The figures above use this elevation's own depth; the drawing runs ${FT(Math.abs(fp.d-plan.d))} long at the front. ` : ''}
      ${!DRAWN?'' : traced?`<b>The outline comes from the architectural CAD file</b>  — the finish-face area polylines, unioned — so bump-outs and jogs are exact, not traced.`
              :`<b>No traced outline exists for this plan, so the house is drawn as a plain rectangle</b> at its overall width and depth — bump-outs and jogs are not shown.`}
      ${!DRAWN?'' : doorFound?`The overhead door is read from the traced outline at the alley face.`
                 :`<b>The garage position is indicative only</b>, not the true opening.`}
      ${DRAWN?`<b>Left and right are read standing at the street looking at the house</b>, matching how OCH designates a plan. The drawing is a view from above with the street at the bottom, so the garage side shown is the side you would see it on in person.
      The driveway is drawn square from the door to the alley; the surveyed apron has not been extracted.`:''}
      ${LOT.wall?`A retaining wall is recorded on this lot${LOT.wexp!=null?` at ${LOT.wexp.toFixed(1)}' exposed`:''}${DRAWN?' and is not drawn':''}.`:''}
      ${unk.length?`<b>${unk.length} offered plan(s) are not in this sheet's plan table</b> (${esc(unk.join(', '))}) — the library has drifted, check lot-map.html.`:''}
      <br><b>A sales conversation aid — not a plot plan and not a permit document.</b>
      Confirm against the surveyed plot plan before making commitments to a buyer.
    </div>

    <div class="foot">
      <span>${esc(MAP.meta.name||'')} · ${esc(MAP.meta.city||'')}</span>
      <span>${esc(MAP.meta.platSource||'')} &nbsp;·&nbsp; SHEET ${SHEET_BUILD}</span>
    </div>`;
}
boot();
</script>
