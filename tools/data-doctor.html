<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Data Doctor — Olivia Clarke Homes</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{ --ink:#111; --mid:#5A5F63; --light:#8A9095; --faint:#D8DCDF; --bg:#F4F5F3;
         --bad:#8C2F23; --warn:#8A6410; --good:#2B6140; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:13px;line-height:1.55}
  header{background:#fff;border-bottom:1px solid var(--ink);padding:16px 22px}
  h1{margin:0;font-size:17px;font-weight:600;letter-spacing:-.2px}
  .sub{color:var(--mid);font-size:11px;margin-top:3px;letter-spacing:.3px}
  .bar{background:#fff;border-bottom:1px solid var(--faint);padding:11px 22px;
       display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap}
  label{font-size:10px;color:var(--mid);text-transform:uppercase;letter-spacing:.6px;
        display:block;margin-bottom:3px}
  select,button{font-family:inherit;font-size:13px;padding:6px 10px;
                border:1px solid var(--light);background:#fff;color:var(--ink);border-radius:0}
  button{cursor:pointer}
  button.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
  button:disabled{opacity:.4;cursor:default}
  main{padding:22px;max-width:1500px}
  section{background:#fff;border:1px solid var(--faint);margin-bottom:18px}
  section > h2{margin:0;font-size:12px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;
               padding:11px 16px;border-bottom:1px solid var(--faint);background:#FAFBFA}
  .body{padding:14px 16px}
  .cards{display:flex;gap:12px;flex-wrap:wrap;padding:14px 16px}
  .card{border:1px solid var(--faint);padding:10px 14px;min-width:132px}
  .card .n{font-size:21px;font-weight:600;letter-spacing:-.5px}
  .card .k{font-size:10px;color:var(--mid);text-transform:uppercase;letter-spacing:.6px;margin-top:2px}
  .card.bad .n{color:var(--bad)} .card.warn .n{color:var(--warn)} .card.good .n{color:var(--good)}
  table{border-collapse:collapse;width:100%;font-size:12px}
  th{text-align:left;font-weight:600;font-size:10px;text-transform:uppercase;letter-spacing:.6px;
     color:var(--mid);padding:8px 10px;border-bottom:1px solid var(--ink);white-space:nowrap;
     position:sticky;top:0;background:#fff}
  td{padding:7px 10px;border-bottom:1px solid var(--faint);vertical-align:top}
  td.num{text-align:right;white-space:nowrap}
  tr.bad td:first-child{box-shadow:inset 3px 0 0 var(--bad)}
  tr.warn td:first-child{box-shadow:inset 3px 0 0 var(--warn)}
  tr.ok td:first-child{box-shadow:inset 3px 0 0 var(--faint)}
  .tag{font-size:10px;letter-spacing:.5px;text-transform:uppercase;font-weight:600;white-space:nowrap}
  .tag.bad{color:var(--bad)} .tag.warn{color:var(--warn)} .tag.ok{color:var(--good)}
  .why{color:var(--mid);font-size:11px;max-width:620px}
  .scroll{max-height:none;overflow:visible}
  .note{color:var(--mid);font-size:11.5px}
  code{background:#F0F1EF;padding:1px 4px;font-size:11.5px}
  .err{color:var(--bad);padding:14px 16px}
  .filters{display:flex;gap:7px;padding:11px 16px;border-bottom:1px solid var(--faint);flex-wrap:wrap}
  .filters button{font-size:11px;padding:4px 10px}
  .filters button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
</style>
</head>
<body>

<header>
  <h1>Data Doctor</h1>
  <div class="sub">Audits a community's lot data against its own recorded plat, and writes a corrected orientation file.</div>
</header>

<div class="bar">
  <div><label>Community</label>
    <select id="comm">
      <option value="heights-uptown">The Heights at Uptown</option>
      <option value="grandoaks-1a">Grand Oaks at Green Meadows — Ph 1A</option>
      <option value="grandoaks-1b">Grand Oaks at Green Meadows — Ph 1B</option>
    </select>
  </div>
  <button class="primary" id="run">Run the audit</button>
  <div style="margin-left:auto;display:flex;gap:8px">
    <button id="dlOrient" disabled>Download corrected orientation file</button>
    <button id="dlCsv" disabled>Download the table as CSV</button>
    <button id="dlGeom" disabled>Download geometry for problem lots</button>
  </div>
</div>

<main id="out"></main>

<script>
/* =====================================================================
   DATA DOCTOR — reads a community's own data files and reports where they
   contradict themselves, then writes a corrected orientation file.

   This exists because the lot fit sheet had grown a runtime workaround for
   bad data: every time a lot drew wrong, the sheet learned to detect and
   compensate. That is the wrong place for the fix. The plat is the authority,
   the data files should agree with it, and the tools should be able to trust
   them. This page closes that loop without a terminal — it runs in the
   browser, against the live files, and hands back a file to commit.

   WHAT IT CHECKS

   1  FRONTAGE.  <community>-orient.json records, per lot, the segment that
      fronts the street. The sheet rotates the lot so that segment is
      horizontal with the street at the bottom. The plat's `lw` IS the
      frontage width, so it is an independent check. Two failure modes:

        WRONG SIDE   a side line is recorded as the frontage (L-17 records
                     110.2' on a lot whose frontage is 60.9'). The segment
                     tells us nothing about where the street is. REPLACE it.
        TRUNCATED    only the straight part of a frontage that bends at a
                     clipped corner is recorded (K-21 records 64.0' of a
                     74.7' frontage). The segment is on the correct side and
                     gives a squarer drawing than the corner-to-corner chord.
                     KEEP it.

      Distinguished by whether the best-matching chord sits on top of the
      recorded segment. See resolveFront below — same logic as the sheet.

   2  PAD PLACEMENT.  padD is the pad's depth and is trusted; the pad polygon
      is its outline. On lots measured so far the outline sits 5–11' nearer
      the alley than its own depth implies, which is why the sheet clamps the
      home to the rear building line. This counts how widespread that is.

   3  OCH OWNERSHIP.  ownership is currently inferred from whether a lot has
      an address, which overcounts. This reports the gap.

   NOTHING HERE WRITES TO THE REPO. It produces a file to download and commit.
   ===================================================================== */

const $=id=>document.getElementById(id);
let LAST=null;

/* ---------- geometry, identical to lot-fit-sheet.html ---------- */
const sub=(a,b)=>[a[0]-b[0],a[1]-b[1]];
const mid=e=>[(e[0][0]+e[1][0])/2,(e[0][1]+e[1][1])/2];
function centroid(p){let A=0,cx=0,cy=0;
  for(let i=0;i<p.length;i++){const [x0,y0]=p[i],[x1,y1]=p[(i+1)%p.length];
    const c=x0*y1-x1*y0;A+=c;cx+=(x0+x1)*c;cy+=(y0+y1)*c;}
  if(Math.abs(A)<1e-9){const n=p.length;
    return [p.reduce((s,q)=>s+q[0],0)/n,p.reduce((s,q)=>s+q[1],0)/n];}
  A*=0.5;return [cx/(6*A),cy/(6*A)];}
function rot(p,a,o){const c=Math.cos(a),s=Math.sin(a),dx=p[0]-o[0],dy=p[1]-o[1];
  return [o[0]+dx*c-dy*s, o[1]+dx*s+dy*c];}
function orientLot(lot,frontSeg){
  const fr=frontSeg, o=centroid(lot.pts);
  const v=sub(fr[1],fr[0]);
  let a=-Math.atan2(v[1],v[0]);
  let pts=lot.pts.map(p=>rot(p,a,o));
  let f=fr.map(p=>rot(p,a,o));
  if(mid(f)[1] < centroid(pts)[1]){ a+=Math.PI;
    pts=lot.pts.map(p=>rot(p,a,o)); f=fr.map(p=>rot(p,a,o)); }
  return {pts:pts, front:f, angle:a, origin:o};
}
function chords(pts){
  const n=pts.length, out=[];
  for(let i=0;i<n;i++) for(let k=1;k<n;k++){
    const a=pts[i], b=pts[(i+k)%n];
    out.push({a:a,b:b,len:Math.hypot(b[0]-a[0],b[1]-a[1]),
              mx:(a[0]+b[0])/2, my:(a[1]+b[1])/2});
  }
  return out;
}
/* The pad's depth axis and which end of it is the street, or null when the pad
   cannot say. Shared by padFront (which derives a frontage) and padVerify
   (which checks one we already have). */
function padAxis(lot,frontBL,rearBL){
  const pad=lot.pad;
  if(!pad||pad.length<4)return null;
  let best=null;
  for(let i=0;i<pad.length;i++){
    const a=pad[i],b=pad[(i+1)%pad.length];
    const L=Math.hypot(b[0]-a[0],b[1]-a[1]);
    if(!best||L>best.L)best={L:L,ux:(b[0]-a[0])/L,uy:(b[1]-a[1])/L};
  }
  if(!best||best.L<20)return null;
  const ux=best.ux,uy=best.uy,pr=q=>q[0]*ux+q[1]*uy;
  const lotP=lot.pts.map(pr),padP=pad.map(pr);
  const lo=Math.min.apply(null,lotP),hi=Math.max.apply(null,lotP);
  const gapLo=Math.min.apply(null,padP)-lo,gapHi=hi-Math.max.apply(null,padP);
  const fits=(g,o)=>Math.abs(g-frontBL)<=4.0&&o>=rearBL-4.0;
  const loSt=fits(gapLo,gapHi),hiSt=fits(gapHi,gapLo);
  if(loSt===hiSt)return null;
  return {ux:ux,uy:uy,pr:pr,lo:lo,hi:hi,street:loSt?lo:hi,alley:loSt?hi:lo,
          gapLo:gapLo,gapHi:gapHi};
}

/* A recorded frontage whose LENGTH matches the plat still gets trusted by the
   fast path — but on a lot whose two ends are a similar width, the segment on
   file may be the ALLEY end, not the street. The lot then draws the right shape
   upside down, with the garage facing the street, which looks plausible and is
   completely wrong. Where the pad can tell the ends apart, check it. */
function padVerify(lot,front,frontBL,rearBL){
  const ax=padAxis(lot,frontBL,rearBL);
  if(!ax)return null;
  const fm=[(front[0][0]+front[1][0])/2,(front[0][1]+front[1][1])/2];
  const f=ax.pr(fm);
  if(Math.abs(f-ax.street)<=Math.abs(f-ax.alley))return {ok:true};
  return {ok:false,front:frontAt(lot,ax,ax.street)};
}
function frontAt(lot,ax,target){
  let anchor=lot.pts[0],bd=Infinity;
  lot.pts.forEach(function(q){const d=Math.abs(ax.pr(q)-target);if(d<bd){bd=d;anchor=q;}});
  const px=-ax.uy,py=ax.ux;
  return [[anchor[0]-px*10,anchor[1]-py*10],[anchor[0]+px*10,anchor[1]+py*10]];
}
function padFront(lot,frontBL,rearBL){
  const ax=padAxis(lot,frontBL,rearBL);
  if(!ax)return null;
  return {front:frontAt(lot,ax,ax.street),gapLo:ax.gapLo,gapHi:ax.gapHi};
}
function padFront_OLD(lot,frontBL,rearBL){
  const pad=lot.pad;
  if(!pad||pad.length<4)return null;
  let best=null;
  for(let i=0;i<pad.length;i++){
    const a=pad[i],b=pad[(i+1)%pad.length];
    const L=Math.hypot(b[0]-a[0],b[1]-a[1]);
    if(!best||L>best.L)best={L:L,ux:(b[0]-a[0])/L,uy:(b[1]-a[1])/L};
  }
  if(!best||best.L<20)return null;
  const ux=best.ux,uy=best.uy,pr=q=>q[0]*ux+q[1]*uy;
  const lotP=lot.pts.map(pr),padP=pad.map(pr);
  const lo=Math.min.apply(null,lotP),hi=Math.max.apply(null,lotP);
  const gapLo=Math.min.apply(null,padP)-lo,gapHi=hi-Math.max.apply(null,padP);
  const fits=(g,o)=>Math.abs(g-frontBL)<=4.0&&o>=rearBL-4.0;
  const loSt=fits(gapLo,gapHi),hiSt=fits(gapHi,gapLo);
  if(loSt===hiSt)return null;                 /* cannot tell the ends apart */
  const target=loSt?lo:hi;
  let anchor=lot.pts[0],bd=Infinity;
  lot.pts.forEach(function(q,i){const d=Math.abs(lotP[i]-target);if(d<bd){bd=d;anchor=q;}});
  const px=-uy,py=ux;
  return {front:[[anchor[0]-px*10,anchor[1]-py*10],[anchor[0]+px*10,anchor[1]+py*10]],
          gapLo:gapLo,gapHi:gapHi};
}
function resolveFront(lot,orient,frontBL,rearBL){
  const rec=orient.front, lw=lot.lw;
  const recLen=(rec&&rec.length===2)
    ? Math.hypot(rec[1][0]-rec[0][0],rec[1][1]-rec[0][1]) : null;
  if(recLen==null) return {ok:false,why:'no frontage segment is recorded for this lot'};
  if(lw==null) return {ok:true,front:rec,src:'recorded'};

  const tol=Math.max(3.0,lw*0.08);
  if(Math.abs(recLen-lw)<=tol){
    /* Length agrees with the plat — but is it the STREET end? On a lot whose
       two ends are a similar width the recorded segment may be the alley end,
       and the sheet would draw the lot upside down with the garage on the
       street. The pad settles it where it can. */
    const v=padVerify(lot,rec,frontBL,rearBL);
    if(v&&!v.ok) return {ok:true,front:v.front,src:'pad-corrected',
      why:`the frontage recorded for this lot is the right length but sits at the ALLEY end of the lot. The engineer's graded pad places the street at the opposite end, so the lot has been turned round — it was previously drawn with the garage facing the street.`};
    return {ok:true,front:rec,src:'recorded'};
  }

  /* The recorded segment is not the frontage. Look for a chord that is. */
  const hit=chords(lot.pts).filter(c=>Math.abs(c.len-lw)<=tol);
  /* collapse chords that are the same line traversed either way */
  const groups=[];
  hit.forEach(c=>{ if(!groups.some(g=>Math.hypot(g.mx-c.mx,g.my-c.my)<1.0)) groups.push(c); });

  /* Where the frontage cannot be settled, the recorded segment is still the
     best guess available, and a drawn-but-flagged sheet beats an empty box on
     a preliminary tool that is always followed by a surveyed plot plan. Every
     unresolved return therefore carries `guess` for the drawing to fall back
     on, while `ok` stays false so the banner fires. */
  const stem=`the frontage recorded for this lot is ${recLen.toFixed(1)}', but the plat frontage is ${lw.toFixed(1)}'`;
  if(groups.length===0){
    const pf=padFront(lot,frontBL,rearBL);
    if(pf) return {ok:true,front:pf.front,src:'pad-derived',
      why:`${stem}, and no edge of the polygon matches it either — this lot's frontage is measured along a curve. The street-to-alley direction has been taken from the engineer's graded pad instead, which is laid out along it.`};
    return {ok:false,guess:rec,why:`${stem}, and no edge of the lot polygon matches the plat`};
  }
  if(groups.length===1)
    return {ok:true,front:[groups[0].a,groups[0].b],src:'re-derived',
            why:`${stem}. The frontage has been re-read from the plat polygon.`};

  /* Several chords match the plat. The recorded segment is still worth
     something: there are two distinct ways it goes wrong and they are not
     equally bad.

       WRONG SIDE   L-17 named the lot's west SIDE line as the frontage. The
                    recorded segment tells us nothing about where the street is.
       TRUNCATED    K-21 named the 64.0' straight part of a frontage that is
                    really 74.7' — the derivation missed the clipped corner at
                    the north end. The segment is on the CORRECT side; it is
                    merely short.

     Truncation is the common case, so the recorded segment is trusted for which
     side of the lot faces the street even when its length is wrong. Among the
     matching chords, take the one sitting on top of it. */
  const rm=mid(rec);
  const near=groups.map(g=>({g:g,d:Math.hypot(g.mx-rm[0],g.my-rm[1])}))
                   .sort((a,b)=>a.d-b.d);

  /* TRUNCATED: a matching chord sits right on top of the recorded segment, so
     the recorded segment IS part of the frontage and only its length was wrong.
     Keep it — the chord runs corner to corner across the bend, which tilts the
     whole lot and the pad with it; the straight part draws square. */
  if(near[0].d <= 0.35*lw)
    return {ok:true,front:rec,src:'recorded',
      why:`the frontage recorded for this lot measures ${recLen.toFixed(1)}' against the plat's ${lw.toFixed(1)}' because it is only the straight part of a frontage that bends at a clipped corner. It is on the correct side of the lot, so it has been kept for the drawing.`};

  if(near[0].d*2 < near[1].d){
    const g=near[0].g;
    return {ok:true,front:[g.a,g.b],src:'re-derived',
            why:`${stem}. The frontage has been re-read from the plat polygon.`};
  }

  /* Nothing in the plat separates the candidates. The pad can, where it is
     clearly laid out street-to-alley. */
  const pf=padFront(lot,frontBL,rearBL);
  if(pf) return {ok:true,front:pf.front,src:'pad-derived',
    why:`${stem}, and several edges match it equally well. The street-to-alley direction has been taken from the engineer's graded pad instead.`};

  return {ok:false,guess:rec,why:`${stem}, and ${groups.length} different edges of the lot match it with none clearly matching the recorded frontage, so which one fronts the street cannot be settled from the plat alone`};
}


/* ---------- the audit ---------- */
async function audit(comm){
  const [m,o]=await Promise.all([
    fetch('../data/'+comm+'.json').then(r=>{if(!r.ok)throw new Error(comm+'.json — '+r.status);return r.json();}),
    fetch('../data/'+comm+'-orient.json').then(r=>{if(!r.ok)throw new Error(comm+'-orient.json — '+r.status);return r.json();})
  ]);
  const M=m.meta||{};
  const rearBL=M.rearBL!=null?M.rearBL:20;
  const rows=[];

  m.lots.forEach(lot=>{
    const key=lot.b+'-'+lot.l;
    const or=o[key];
    if(!or) return;                       /* no orientation record: not this file's problem */
    const r=resolveFront(lot,or,M.frontBL!=null?M.frontBL:10,rearBL);
    /* The sheet's resolver reports `src`, not a status word. Translate, so the
       audit names exactly what the sheet did rather than a parallel vocabulary. */
    const code = !r.ok ? (r.code||'CANNOT RESOLVE')
      : r.src==='pad-derived'   ? 'PAD-DERIVED'
      : r.src==='pad-corrected' ? 'TURNED ROUND'
      : r.src==='re-derived'    ? 'WRONG SIDE'
      : r.why                   ? 'TRUNCATED' : 'OK';
    const row={key:key, addr:lot.addr||'', lw:lot.lw, ld:lot.ld,
               code:code, why:r.why||'', recLen:r.recLen, front:r.ok?r.front:null,
               changed:!!(r.ok&&r.src==='re-derived'), depth:null, padOff:null};

    if(r.ok){
      const O=orientLot(lot,r.front);
      const ys=O.pts.map(p=>p[1]);
      const miny=Math.min(...ys), maxy=Math.max(...ys);
      row.depth=maxy-miny;
      const xs2=O.pts.map(p=>p[0]);
      row.pageW=Math.max.apply(null,xs2)-Math.min.apply(null,xs2);
      row.pageD=row.depth;
      /* A lot drawn wider than deep, on a community of deep narrow lots, is the
         symptom Brandi reported: the lot lying on its side. Flag it outright. */
      row.landscape = row.pageW > row.pageD;
      if(lot.ld!=null && Math.abs(row.depth-lot.ld)>Math.max(4.0,lot.ld*0.10)){
        row.code='DEPTH MISMATCH';
        row.why=`with this frontage the lot measures ${row.depth.toFixed(1)}' street to alley, but the plat records ${lot.ld.toFixed(1)}'`;
        row.changed=false; row.front=null;
      }
      /* pad outline against the rear building line */
      if(lot.pad&&lot.pad.length){
        const pp=lot.pad.map(p=>rot(p,O.angle,O.origin));
        const padT=Math.min(...pp.map(p=>p[1]));
        const off=(miny+rearBL)-padT;
        if(off>0.5) row.padOff=off;
      }
    }
    rows.push(row);
  });

  /* OCH ownership, as currently inferred */
  const addressed=m.lots.filter(l=>l.addr).length;
  const flagged=m.lots.filter(l=>l.och===true).length;

  const lotsByKey={}; m.lots.forEach(l=>{lotsByKey[l.b+'-'+l.l]=l;});
  return {comm:comm, meta:M, orient:o, rows:rows, rearBL:rearBL, lotsByKey:lotsByKey,
          totalLots:m.lots.length, orientRecords:Object.keys(o).length,
          addressed:addressed, flagged:flagged};
}

/* ---------- rendering ---------- */
const SEV={'OK':'ok','TRUNCATED':'warn','PAD-DERIVED':'warn','TURNED ROUND':'warn','CANNOT RESOLVE':'bad','NO PLAT WIDTH':'warn','WRONG SIDE':'bad',
           'AMBIGUOUS':'bad','NO MATCH':'bad','NO RECORD':'bad','DEPTH MISMATCH':'bad'};
let FILTER='all';

function render(A){
  const n=c=>A.rows.filter(r=>r.code===c).length;
  const broken=A.rows.filter(r=>SEV[r.code]==='bad').length;
  const pads=A.rows.filter(r=>r.padOff!=null);
  const padAvg=pads.length?pads.reduce((s,r)=>s+r.padOff,0)/pads.length:0;

  let h='';
  h+=`<section><h2>Frontage — ${A.rows.length} lots with an orientation record, of ${A.totalLots} in the plat</h2>
    <div class="cards">
      <div class="card good"><div class="n">${n('OK')}</div><div class="k">agree with the plat</div></div>
      <div class="card warn"><div class="n">${n('TRUNCATED')}</div><div class="k">truncated · kept</div></div>
      <div class="card bad"><div class="n">${n('WRONG SIDE')}</div><div class="k">wrong side · replaced</div></div>
      <div class="card bad"><div class="n">${n('AMBIGUOUS')+n('NO MATCH')+n('DEPTH MISMATCH')+n('NO RECORD')}</div><div class="k">cannot resolve</div></div>
    </div>
    <div class="body note">A lot marked <b>wrong side</b> records a segment on a different edge of the lot than the frontage; the corrected file replaces it. A lot marked <b>truncated</b> records only the straight part of a frontage that bends — it is on the right side and is kept, because the corner-to-corner chord tilts the drawing. A lot that <b>cannot be resolved</b> is left exactly as it is and needs a human eye.</div>
  </section>`;

  h+=`<section><h2>Pad outlines against the ${A.rearBL}' rear building line</h2>
    <div class="cards">
      <div class="card ${pads.length?'bad':'good'}"><div class="n">${pads.length}</div><div class="k">pads past the line</div></div>
      <div class="card"><div class="n">${padAvg?padAvg.toFixed(1)+"'":'—'}</div><div class="k">average overhang</div></div>
      <div class="card"><div class="n">${pads.length?Math.max(...pads.map(r=>r.padOff)).toFixed(1)+"'":'—'}</div><div class="k">worst</div></div>
    </div>
    <div class="body note">The pad <b>depth</b> (<code>padD</code>) is trusted and the fit margins come from it, so these lots still size correctly. What is off is where the pad <b>outline</b> is drawn. The fit sheet already holds the home at the building line rather than following the pad edge, so this is a data-quality finding, not a live error. <b>This page does not change pad geometry</b> — fixing it means going back to the grading drawings.</div>
  </section>`;

  h+=`<section><h2>OCH ownership</h2>
    <div class="cards">
      <div class="card"><div class="n">${A.totalLots}</div><div class="k">lots in the plat</div></div>
      <div class="card ${A.flagged?'good':'warn'}"><div class="n">${A.flagged||'—'}</div><div class="k">flagged <code>och:true</code></div></div>
      <div class="card warn"><div class="n">${A.addressed}</div><div class="k">inferred, by address</div></div>
    </div>
    <div class="body note">${A.flagged
      ? `This community carries an explicit <code>och</code> flag, which is the right way round.`
      : `No lot in this community carries an <code>och</code> flag, so the tools infer ownership from whether a lot has an address — which counts <b>${A.addressed}</b>. Until the flag exists, any count of "OCH lots" in this community is that number, not the real one.`}</div>
  </section>`;

  h+=`<section><h2>Every lot</h2>
    <div class="filters">
      ${['all','needs attention','changed','ok'].map(f=>
        `<button class="${FILTER===f?'on':''}" onclick="setFilter('${f}')">${f}</button>`).join('')}
    </div>
    <div class="scroll"><table><thead><tr>
      <th>Lot</th><th>Address</th><th>Plat W×D</th><th>Recorded</th><th>Status</th><th>Pad</th><th>What it means</th>
    </tr></thead><tbody>`;

  A.rows.filter(r=>{
    if(FILTER==='needs attention') return SEV[r.code]!=='ok';
    if(FILTER==='changed') return r.changed;
    if(FILTER==='ok') return r.code==='OK';
    return true;
  }).forEach(r=>{
    h+=`<tr class="${SEV[r.code]}">
      <td><b>${r.key}</b></td>
      <td>${r.addr||'<span class="note">—</span>'}</td>
      <td class="num">${r.lw!=null?r.lw.toFixed(1):'—'} × ${r.ld!=null?r.ld.toFixed(1):'—'}</td>
      <td class="num">${r.recLen!=null?r.recLen.toFixed(1)+"'":'—'}</td>
      <td><span class="tag ${SEV[r.code]}">${r.code}</span></td>
      <td class="num">${r.padOff!=null?'<span class="tag warn">+'+r.padOff.toFixed(1)+"'</span>":''}</td>
      <td class="why">${r.why||''}</td>
    </tr>`;
  });
  h+='</tbody></table></div></section>';

  const changed=A.rows.filter(r=>r.changed).length;
  h+=`<section><h2>The corrected file</h2><div class="body note">
    <b>${changed}</b> frontage${changed===1?'':'s'} would change. Everything else in
    <code>${A.comm}-orient.json</code> is carried through untouched, including lots this page
    could not resolve. Each corrected record gains <code>frontSource</code> so the change is
    visible in the diff, and each unresolved one gains <code>review:true</code>.
    <br><br><b>Before you commit it:</b> read the changed rows above. This page reasons from the
    plat polygon alone — it has never seen the recorded plat drawing, and it does not know which
    street a corner lot is addressed from.
  </div></section>`;

  $('out').innerHTML=h;
  $('dlOrient').disabled=false; $('dlCsv').disabled=false; $('dlGeom').disabled=false;
}
function setFilter(f){ FILTER=f; render(LAST); }

/* ---------- output ---------- */
function correctedOrient(A){
  const out={};
  Object.keys(A.orient).forEach(k=>{
    const src=A.orient[k], row=A.rows.find(r=>r.key===k);
    const rec=Object.assign({},src);
    if(row){
      if(row.changed&&row.front){
        rec.front=[[+row.front[0][0].toFixed(2),+row.front[0][1].toFixed(2)],
                   [+row.front[1][0].toFixed(2),+row.front[1][1].toFixed(2)]];
        rec.frontLen=+Math.hypot(rec.front[1][0]-rec.front[0][0],
                                 rec.front[1][1]-rec.front[0][1]).toFixed(1);
        rec.frontSource='plat-rederived 2026-10-13';
      } else if(row.code==='TRUNCATED'){
        rec.frontSource='recorded, truncated at a clipped corner — verified against the plat';
      } else if(SEV[row.code]==='bad'){
        rec.review=true;
        rec.reviewWhy=row.why;
      }
    }
    out[k]=rec;
  });
  return out;
}
function save(name,text,type){
  const b=new Blob([text],{type:type||'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(b); a.download=name; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}
$('dlOrient').onclick=()=>{
  save(LAST.comm+'-orient.json', JSON.stringify(correctedOrient(LAST),null,1));
};
$('dlCsv').onclick=()=>{
  const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  const head=['lot','address','platW','platD','drawnW','drawnD','landscape','recordedFrontLen','status','padOverhangFt','note'];
  const body=LAST.rows.map(r=>[r.key,r.addr,r.lw,r.ld,
    r.pageW!=null?r.pageW.toFixed(1):'',r.pageD!=null?r.pageD.toFixed(1):'',r.landscape?'LANDSCAPE':'',
    r.recLen!=null?r.recLen.toFixed(1):'',r.code,
    r.padOff!=null?r.padOff.toFixed(1):'',r.why].map(q).join(','));
  save(LAST.comm+'-audit.csv',[head.map(q).join(','),...body].join('\n'),'text/csv');
};

/* The lot file is too large to read whole from outside the browser, so any lot
   the audit cannot settle is exported here with its raw geometry attached —
   plat polygon, pad and the recorded frontage. That is everything needed to
   work out what the right answer is without guessing. */
$('dlGeom').onclick=()=>{
  const bad=LAST.rows.filter(r=>SEV[r.code]!=='ok'||r.landscape);
  const out={community:LAST.comm, generated:new Date().toISOString(),
    meta:{frontBL:LAST.meta.frontBL,rearBL:LAST.meta.rearBL,
          sideInterior:LAST.meta.sideInterior,porchEncroach:LAST.meta.porchEncroach},
    lots:bad.map(r=>{
      const lot=LAST.lotsByKey[r.key]||{};
      return {key:r.key, addr:r.addr, status:r.code, why:r.why,
              landscape:!!r.landscape,
              drawn:r.pageW!=null?[+r.pageW.toFixed(2),+r.pageD.toFixed(2)]:null,
              lw:lot.lw, ld:lot.ld, padW:lot.padW, padD:lot.padD,
              pts:lot.pts, pad:lot.pad, orient:LAST.orient[r.key]};
    })};
  save(LAST.comm+'-problem-lots.json', JSON.stringify(out,null,1));
};

$('run').onclick=async()=>{
  $('out').innerHTML='<section><div class="body note">Reading the data files…</div></section>';
  $('dlOrient').disabled=true; $('dlCsv').disabled=true; $('dlGeom').disabled=true;
  try{
    LAST=await audit($('comm').value);
    FILTER='needs attention';
    render(LAST);
  }catch(e){
    $('out').innerHTML='<section><h2>Could not run</h2><div class="err">'
      +String(e.message||e)+'<br><br>This page expects to sit in <code>tools/</code> alongside the other tools, '
      +'so that <code>../data/</code> reaches the data files.</div></section>';
  }
};
$('out').innerHTML='<section><div class="body note">Pick a community and run the audit. '
  +'Nothing is written anywhere — the page reads the live data files and produces a corrected '
  +'file for you to download and commit.</div></section>';
</script>
</body>
</html>
