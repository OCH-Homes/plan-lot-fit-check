<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lot Fit Check</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap');
:root{
 --paper:#EDEFF1;--card:#F8F9FA;--ink:#16232E;--structural:#2E4A63;
 --slate:#5B6B76;--line:#C7CDD1;--line-soft:#DDE1E3;
 --pass:#2F7D5A;--pass-bg:#E7F2EC;--warn:#B8791E;--warn-bg:#F6ECDA;
 --fail:#A6392E;--fail-bg:#F5E4E1;--manual:#5B6B76;--manual-bg:#E7E9EA;
 --l50:#4E79A7;--l60:#59A14F;--l70:#B07AA1;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'Inter',sans-serif;font-size:14px;line-height:1.5}
h1,h2,h3,h4{font-family:'Space Grotesk',sans-serif;margin:0}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;
     padding:14px 20px;border-bottom:2px solid var(--ink);background:#fff;flex-wrap:wrap}
.top h1{font-size:20px;font-weight:700}
.top .sub{color:var(--slate);font-size:12.5px}
.tag{font-family:'IBM Plex Mono',monospace;font-size:11px;border:1px solid var(--line);
     background:var(--card);padding:5px 9px;border-radius:3px;color:var(--structural)}
.shell{display:grid;grid-template-columns:minmax(320px,1fr) 440px;height:calc(100vh - 66px)}
@media(max-width:1100px){.shell{grid-template-columns:1fr;height:auto}}
.mapwrap{position:relative;background:#fff;overflow:hidden;border-right:1px solid var(--line)}
#map{width:100%;height:100%;display:block;cursor:grab;touch-action:none}
#map.drag{cursor:grabbing}
.side{overflow-y:auto;background:var(--card);padding:16px}
@media(max-width:1100px){.mapwrap{height:62vh}}
.ctrls{position:absolute;top:10px;left:10px;display:flex;flex-direction:column;gap:6px;z-index:5}
.ctrls button,.legendbox,.searchbox input{background:#fff;border:1px solid var(--line);border-radius:4px;
  font-family:'IBM Plex Mono',monospace;font-size:12px;padding:5px 9px;cursor:pointer;color:var(--ink)}
.ctrls button:hover{background:var(--card)}
.legendbox{position:absolute;bottom:10px;left:10px;cursor:default;padding:9px 11px;line-height:1.75;z-index:5;max-width:250px}
.legendbox b{font-family:'Space Grotesk';font-size:11.5px;display:block;margin-bottom:3px}
.legendbox i{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:6px;vertical-align:-1px;border:1px solid rgba(0,0,0,.18)}
.searchbox{position:absolute;top:10px;right:10px;z-index:5}
.searchbox input{width:160px;cursor:text}
.lot{stroke:#16232E;stroke-width:.6;cursor:pointer}
.lot:hover{stroke-width:2.2;stroke:#111}
.lot.sel{stroke:#111;stroke-width:3}
.lot.dim{opacity:.13}
.lot.exc{stroke-dasharray:3 2;stroke:#8A959C;stroke-width:.9}
body .lot.exc:hover{stroke:#5B6B76;stroke-width:2.2}
.curb{fill:none;stroke:#B8C2C9;stroke-width:1.1}
.lotno{font-family:'IBM Plex Mono',monospace;font-size:5px;fill:#16232E;pointer-events:none;text-anchor:middle;opacity:.75}
.stname{font-family:'Inter';font-size:6.5px;fill:#7C8A93;pointer-events:none;text-anchor:middle;letter-spacing:.4px}
.blname{font-family:'Space Grotesk';font-size:8px;font-weight:600;fill:#9AA6AD;pointer-events:none;text-anchor:middle}
.drvmark{pointer-events:none}
h3.sh{font-size:13px;margin:16px 0 7px;padding-bottom:5px;border-bottom:1px solid var(--line-soft);
      color:var(--structural);text-transform:uppercase;letter-spacing:.6px;font-size:11px}
.kv{display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-size:13px}
.kv .k{color:var(--slate)}
.kv .v{font-family:'IBM Plex Mono',monospace;text-align:right}
.pill{display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:10.5px;font-weight:600;
      padding:2px 7px;border-radius:3px;margin-right:4px}
.p-pass{background:var(--pass-bg);color:var(--pass)}
.p-warn{background:var(--warn-bg);color:var(--warn)}
.p-fail{background:var(--fail-bg);color:var(--fail)}
.p-neut{background:var(--manual-bg);color:var(--manual)}
.card2{background:#fff;border:1px solid var(--line);border-radius:5px;padding:12px 13px;margin-bottom:10px}
.big{font-family:'IBM Plex Mono',monospace;font-size:26px;font-weight:600;letter-spacing:-.5px}
.remedy{border-left:3px solid var(--structural);background:#fff;padding:10px 12px;font-size:13px;margin-top:8px}
table.pl{width:100%;border-collapse:collapse;font-size:12px;margin-top:6px}
table.pl th{font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--slate);text-align:right;padding:5px 6px;border-bottom:1.5px solid var(--line)}
table.pl th:first-child,table.pl td:first-child{text-align:left}
table.pl td{padding:4px 6px;border-bottom:1px solid var(--line-soft);font-family:'IBM Plex Mono',monospace;text-align:right}
tr.no td{opacity:.4}
.muted{color:var(--slate);font-size:12px}
.hint{color:var(--slate);font-size:12.5px;padding:20px 4px;text-align:center}
.statbar{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:4px;overflow:hidden;margin-bottom:12px}
.statbar div{background:#fff;padding:7px 8px}
.statbar .n{font-family:'IBM Plex Mono',monospace;font-size:17px;font-weight:600}
.statbar .t{font-size:10px;color:var(--slate);text-transform:uppercase;letter-spacing:.4px}
</style>
</head>
<body>
<div class="top">
  <div>
    <h1 id="commName">loading…</h1>
    <div class="sub" id="commSub">&nbsp;</div>
  </div>
  <div style="display:flex;gap:6px;flex-wrap:wrap">
    <a class="tag" href="../index.html" style="text-decoration:none">← communities</a>
    <span class="tag" id="tagPlat"></span>
    <span class="tag" id="tagGrade"></span>
    <span class="tag" id="tagRun"></span>
    <span class="tag" id="tagOurs"></span>
    <span class="tag" id="syncTag" style="cursor:help">starting…</span>
    <span class="tag" id="whoTag" onclick="changeWho()" style="cursor:pointer" title="Click to change who you are">not signed</span>
  </div>
</div>
<div class="shell">
  <div class="mapwrap">
    <svg id="map"></svg>
    <div class="ctrls">
      <button onclick="zoom(1.3)">+</button>
      <button onclick="zoom(1/1.3)">−</button>
      <button onclick="fit()">reset</button>
      <button onclick="cycleColor()" id="cmBtn">color: slope</button>
      <button onclick="toggleNums()" id="numBtn">lot #: on</button>
      <button onclick="togglePick()" id="pickBtn">select lots</button>
      <button onclick="toggleHide()" id="hideBtn">excluded: shown</button>
    </div>
    <div class="searchbox"><input id="q" placeholder="find e.g. A-12 or 530 Callum" oninput="doSearch()" onkeydown="searchKey(event)"></div>
    <div class="legendbox" id="legend"></div>
  </div>
  <div class="side" id="side"></div>
</div>
<script>
let MAP={lots:[],curb:[],streets:[],blocks:[],adj:{},w:1000,h:600};
/* =====================================================================
   CONFIG — fill these in from Supabase: Project Settings -> API
   url : the Project URL            e.g. https://abcdefgh.supabase.co
   key : the anon / public key      (safe to publish; see supabase-setup.sql)
   Leave as-is and the tool still works, but saves only in your own browser.
   ===================================================================== */
const CFG={
  url:'https://erszlacysbetmamlpfpm.supabase.co',
  key:'sb_publishable_jf1zM0RZUwkz-RpS-iT0pQ_xYxgmkn2'
};
/* ---------- plan library (pad depth sets how far a plan can shift back) ---------- */
let PAD_DEPTH=80.0, BASE_RUN=21.0, MAXG=10.0, SLAB=0.83, STD_STEP=0.58;
let RECORD=false, OCH_LOTS=0;
function applyMeta(m){ if(!m)return;
  RECORD = m.mode==='record';
  OCH_LOTS = m.ochLots||0;
  if(m.padDepth)PAD_DEPTH=m.padDepth; if(m.baseRun)BASE_RUN=m.baseRun;
  if(m.maxGrade)MAXG=m.maxGrade; if(m.slab)SLAB=m.slab; if(m.stepDown)STD_STEP=m.stepDown;
  document.title=(m.shortName||'Lot Map')+' — Lot Fit Check';
  const t=document.getElementById('commName'); if(t)t.textContent=m.name||COMMUNITY;
  const s=document.getElementById('commSub');
  if(s)s.textContent='Lot map, driveway grade check & plan fit · '+(m.residentialLots||'')+' residential lots'+(m.city?' · '+m.city:'');
  const r=document.getElementById('tagRun'); if(r)r.textContent='Run '+BASE_RUN+' ft';
  const g=document.getElementById('tagGrade'); if(g)g.textContent='Max grade '+MAXG+'%';
  const p=document.getElementById('tagPlat');
  if(p)p.textContent='Plat: '+(m.residentialLots||'?')+' residential';
}
const PLANS=[
 {id:'campbell_c',n:'Campbell C',coll:"MR 40' FE",lot:50,w:40,d:80.0,gar:'Front'},
 {id:'cooper_a',n:'Cooper A',coll:"MR 40' FE",lot:50,w:40,d:68.0,gar:'Front'},
 {id:'cooper_b',n:'Cooper B',coll:"MR 40' FE",lot:50,w:40,d:68.0,gar:'Front'},
 {id:'cooper_c',n:'Cooper C',coll:"MR 40' FE",lot:50,w:40,d:68.0,gar:'Front'},
 {id:'renner_a',n:'Renner A',coll:"MR 40' FE",lot:50,w:40,d:69.67,gar:'Front'},
 {id:'renner_b',n:'Renner B',coll:"MR 40' FE",lot:50,w:40,d:77.67,gar:'Front'},
 {id:'renner_c',n:'Renner C',coll:"MR 40' FE",lot:50,w:40,d:77.67,gar:'Front'},
 {id:'shelby_d',n:'Shelby D',coll:"MR 40' FE",lot:50,w:40,d:80.0,gar:'Front'},
 {id:'shelby_e',n:'Shelby E',coll:"MR 40' FE",lot:50,w:40,d:80.0,gar:'Front'},
 {id:'shelby_f',n:'Shelby F',coll:"MR 40' FE",lot:50,w:40,d:80.0,gar:'Front'},
 {id:'webber_a',n:'Webber A',coll:"MR 40' FE",lot:50,w:40,d:78.0,gar:'Front'},
 {id:'webber_b',n:'Webber B',coll:"MR 40' FE",lot:50,w:40,d:78.0,gar:'Front'},
 {id:'webber_c',n:'Webber C',coll:"MR 40' FE",lot:50,w:40,d:78.0,gar:'Front'},
 {id:'dakota_a',n:'Dakota A',coll:"MR 50' JS",lot:60,w:50,d:80.0,gar:'J-swing',hand:'LEFT',mirror:true},
 {id:'dakota_b',n:'Dakota B',coll:"MR 50' JS",lot:60,w:50,d:80.0,gar:'J-swing',hand:'LEFT',mirror:true},
 {id:'ross_a',n:'Ross A',coll:"MR 50' FE",lot:60,w:50,d:64.5,gar:'Front'},
 {id:'ross_b',n:'Ross B',coll:"MR 50' FE",lot:60,w:50,d:65.5,gar:'Front'},
 {id:'ross_c',n:'Ross C',coll:"MR 50' FE",lot:60,w:50,d:65.5,gar:'Front'}
];
/* Heights at Uptown — rear-entry cottage plans.
   Finish-face dimensions from the plan sheets, via the workbook (9/3/26).
   Holland measured 9/14/26 (A 76'-6", B 77'-6", C 76'-6" — B is deeper).
   Parker resolved 9/15/26 at 34'-10" x 83'-0". Its sheet shows both 83'-0" and
   88'-0" (~2.5 ft extra at each end = roof overhang). Settled against the built
   record: Parker stands on N-13, N-4 and P-17, all 110 ft deep — 83'-0" clears
   by ~2 ft, 88'-0" would have made all three impossible. */
PLANS.push(
 {id:'addison_a',n:'Addison A',coll:"MR 35' RE",lot:45,w:34.833,d:84.5,gar:'Rear'},
 {id:'addison_b',n:'Addison B',coll:"MR 35' RE",lot:45,w:34.833,d:84.5,gar:'Rear'},
 {id:'addison_c',n:'Addison C',coll:"MR 35' RE",lot:45,w:34.833,d:84.5,gar:'Rear'},
 {id:'carmichael_a',n:'Carmichael A',coll:"MR 35' RE",lot:45,w:34.833,d:82.5,gar:'Rear'},
 {id:'carmichael_b',n:'Carmichael B',coll:"MR 35' RE",lot:45,w:34.833,d:82.5,gar:'Rear'},
 {id:'carmichael_c',n:'Carmichael C',coll:"MR 35' RE",lot:45,w:34.833,d:82.5,gar:'Rear'},
 {id:'crowder_a',n:'Crowder A',coll:"MR 30' RE",lot:45,w:30.0,d:80.0,gar:'Rear'},
 {id:'crowder_b',n:'Crowder B',coll:"MR 30' RE",lot:45,w:30.0,d:80.0,gar:'Rear'},
 {id:'crowder_c',n:'Crowder C',coll:"MR 30' RE",lot:45,w:30.0,d:80.0,gar:'Rear'},
 {id:'holland_a',n:'Holland A',coll:"MR 35' RE",lot:45,w:34.833,d:76.5,gar:'Rear'},
 {id:'holland_b',n:'Holland B',coll:"MR 35' RE",lot:45,w:34.833,d:77.5,gar:'Rear'},
 {id:'holland_c',n:'Holland C',coll:"MR 35' RE",lot:45,w:34.833,d:76.5,gar:'Rear'},
 {id:'knox_a',n:'Knox A',coll:"MR 35' RE",lot:45,w:34.917,d:74.5,gar:'Rear'},
 {id:'knox_b',n:'Knox B',coll:"MR 35' RE",lot:45,w:34.917,d:74.5,gar:'Rear'},
 {id:'knox_c',n:'Knox C',coll:"MR 35' RE",lot:45,w:34.917,d:77.5,gar:'Rear'},
 {id:'parker_a',n:'Parker A',coll:"MR 35' RE",lot:45,w:34.833,d:83.0,gar:'Rear'},
 {id:'parker_b',n:'Parker B',coll:"MR 35' RE",lot:45,w:34.833,d:83.0,gar:'Rear'},
 {id:'parker_c',n:'Parker C',coll:"MR 35' RE",lot:45,w:34.833,d:83.0,gar:'Rear'},
 {id:'pearl_a',n:'Pearl A',coll:"MR 30' RE",lot:45,w:29.917,d:79.917,gar:'Rear'},
 {id:'thompson_a',n:'Thompson A (retired)',coll:"MR 35' RE",lot:45,w:null,d:null,gar:'Rear'},
 {id:'thompson_b',n:'Thompson B (retired)',coll:"MR 35' RE",lot:45,w:null,d:null,gar:'Rear'},
 {id:'logan_a',n:'Logan A (retired)',coll:"MR 35' RE",lot:45,w:null,d:null,gar:'Rear'},
 {id:'logan_c',n:'Logan C (retired)',coll:"MR 35' RE",lot:45,w:null,d:null,gar:'Rear'}
);
/* Grand Oaks 60' front-entry plans — offered per the Community Offerings matrix
   but NEVER MEASURED: no width or depth exists in the plan library for any of
   them. They are listed so they can be assigned and coloured; fit checks report
   "not measured" rather than passing silently. Same for Campbell A/B.
   TO FIX: extract dimensions from the plan sheets, as was done for the 40' family. */
PLANS.push(
 {id:'ellis_a',n:'Ellis A',coll:"MR 50' FE",lot:60,w:null,d:null,gar:'Front'},
 {id:'ellis_b',n:'Ellis B',coll:"MR 50' FE",lot:60,w:null,d:null,gar:'Front'},
 {id:'ellis_d',n:'Ellis D',coll:"MR 50' FE",lot:60,w:null,d:null,gar:'Front'},
 {id:'ellis_e',n:'Ellis E',coll:"MR 50' FE",lot:60,w:null,d:null,gar:'Front'},
 {id:'marshall_a',n:'Marshall A',coll:"MR 50' FE",lot:60,w:null,d:null,gar:'Front'},
 {id:'marshall_b',n:'Marshall B',coll:"MR 50' FE",lot:60,w:null,d:null,gar:'Front'},
 {id:'marshall_c',n:'Marshall C',coll:"MR 50' FE",lot:60,w:null,d:null,gar:'Front'},
 {id:'meredith_a',n:'Meredith A',coll:"MR 50' FE",lot:60,w:null,d:null,gar:'Front'},
 {id:'meredith_b',n:'Meredith B',coll:"MR 50' FE",lot:60,w:null,d:null,gar:'Front'},
 {id:'meredith_c',n:'Meredith C',coll:"MR 50' FE",lot:60,w:null,d:null,gar:'Front'},
 {id:'tyler_a',n:'Tyler A',coll:"MR 50' FE",lot:60,w:null,d:null,gar:'Front'},
 {id:'tyler_b',n:'Tyler B',coll:"MR 50' FE",lot:60,w:null,d:null,gar:'Front'},
 {id:'tyler_c',n:'Tyler C',coll:"MR 50' FE",lot:60,w:null,d:null,gar:'Front'},
 {id:'bradley_a',n:'Bradley A',coll:"MR 50' FE",lot:60,w:null,d:null,gar:'Front'},
 {id:'bradley_b',n:'Bradley B',coll:"MR 50' FE",lot:60,w:null,d:null,gar:'Front'},
 {id:'campbell_a',n:'Campbell A',coll:"MR 40' FE",lot:50,w:null,d:null,gar:'Front'},
 {id:'campbell_b',n:'Campbell B',coll:"MR 40' FE",lot:50,w:null,d:null,gar:'Front'}
);
const PLAN=Object.fromEntries(PLANS.map(p=>[p.id,p]));
const rearShiftOf=p=>Math.max(0,PAD_DEPTH-p.d);

/* ---------- shared state (Supabase) ---------- */
const COMMUNITY=(new URLSearchParams(location.search).get('c')||'grandoaks-1b');
let A={}, EXC={}, monoRule='r2';
let WHO=localStorage.getItem('ochWho')||'';
let syncState='offline', lastSync=null, pending=0;
const SB={
  on(){return !!(CFG.url && CFG.key) && CFG.url.indexOf('YOUR-')<0 && CFG.key.indexOf('YOUR-')<0;},
  h(extra){return Object.assign({apikey:CFG.key,Authorization:'Bearer '+CFG.key,
      'Content-Type':'application/json'},extra||{});},
  async get(path){const r=await fetch(CFG.url+'/rest/v1/'+path,{headers:this.h()});
    if(!r.ok)throw new Error('read failed: '+r.status+' '+(await r.text()).slice(0,120)); return r.json();},
  async upsert(table,rows){
    const r=await fetch(CFG.url+'/rest/v1/'+table,{method:'POST',
      headers:this.h({Prefer:'resolution=merge-duplicates,return=minimal'}),body:JSON.stringify(rows)});
    if(!r.ok)throw new Error('write failed: '+r.status+' '+(await r.text()).slice(0,160));}
};
function setSync(s,msg){syncState=s;const el=document.getElementById('syncTag');
  if(!el)return;
  const t={live:'live',saving:'saving…',offline:'this browser only',error:'sync error'}[s]||s;
  el.textContent=t+(lastSync&&s==='live'?' · '+lastSync.toLocaleTimeString():'');
  el.style.background={live:'#E7F2EC',saving:'#F6ECDA',offline:'#E7E9EA',error:'#F5E4E1'}[s];
  el.style.color={live:'#2F7D5A',saving:'#B8791E',offline:'#5B6B76',error:'#A6392E'}[s];
  el.title=msg||'';}
function keyOf(i){const l=byId[i];return {community:COMMUNITY,block:l.b,lot:parseInt(l.l,10)};}
async function pullAll(){
  if(RECORD){setSync('live','Phase 1A is a record of built lots — nothing to save.');paint();renderSide();return;}
  if(!SB.on()){loadLocal();setSync('offline','No database configured — changes stay in this browser.');return;}
  try{
    const rows=await SB.get('lot_state?community=eq.'+COMMUNITY+'&select=block,lot,plan_id,excluded');
    A={};EXC={};
    const ix={}; MAP.lots.forEach(l=>ix[l.b+'-'+l.l]=l.i);
    rows.forEach(r=>{const i=ix[r.block+'-'+r.lot]; if(i===undefined)return;
      if(r.plan_id)A[i]=r.plan_id; if(r.excluded)EXC[i]=1;});
    const st=await SB.get('community_settings?community=eq.'+COMMUNITY+'&key=eq.mono_rule&select=value');
    if(st.length&&MRULES[st[0].value])monoRule=st[0].value;
    lastSync=new Date(); setSync('live');
  }catch(e){ setSync('error',e.message); loadLocal(); }
  paint();renderSide();
}
function loadLocal(){
  try{A=JSON.parse(localStorage.getItem('ochLotMap1B:assign')||'{}')}catch(e){A={}}
  try{EXC=JSON.parse(localStorage.getItem('ochLotMap1B:excluded')||'{}')}catch(e){EXC={}}
  monoRule=localStorage.getItem('ochLotMap1B:monoRule')||'r2';
}
function cacheLocal(){
  try{localStorage.setItem('ochLotMap1B:assign',JSON.stringify(A));
      localStorage.setItem('ochLotMap1B:excluded',JSON.stringify(EXC));
      localStorage.setItem('ochLotMap1B:monoRule',monoRule);}catch(e){}
}
async function pushLot(i){
  cacheLocal();
  if(!SB.on()){setSync('offline');return;}
  if(!requireWho())return;
  pending++;setSync('saving');
  try{
    await SB.upsert('lot_state',[Object.assign(keyOf(i),
      {plan_id:A[i]||null,excluded:!!EXC[i],updated_by:WHO})]);
    lastSync=new Date();
  }catch(e){setSync('error',e.message);alert('Could not save: '+e.message);return;}
  finally{pending--;}
  if(!pending)setSync('live');
}
async function pushSetting(k,v){
  cacheLocal();
  if(!SB.on()){setSync('offline');return;}
  if(!requireWho())return;
  setSync('saving');
  try{await SB.upsert('community_settings',[{community:COMMUNITY,key:k,value:v,updated_by:WHO}]);
    lastSync=new Date();setSync('live');}
  catch(e){setSync('error',e.message);}
}
function requireWho(){
  if(WHO)return true;
  const n=prompt('Your name — recorded against every change you make:');
  if(!n){alert('A name is needed before changes can be saved.');return false;}
  WHO=n.trim();localStorage.setItem('ochWho',WHO);
  const el=document.getElementById('whoTag'); if(el)el.textContent=WHO;
  return true;
}
async function clearAll(){
  if(!confirm('Remove every plan assignment for everyone?'))return;
  if(!requireWho())return;
  const was=Object.keys(A).map(Number); A={}; paint(); renderSide();
  for(const i of was) await pushLot(i);
}
function changeWho(){WHO='';localStorage.removeItem('ochWho');requireWho();}
async function loadHistory(){
  if(!SB.on())return [];
  try{return await SB.get('change_log?community=eq.'+COMMUNITY+
    '&select=block,lot,field,old_value,new_value,changed_at,changed_by&order=changed_at.desc&limit=40');}
  catch(e){return [];}
}
let sel=null,colorMode=0,showNums=true,q='';
/* ---- lot selection: which lots OCH will actually build ---- */
let pickMode=false, hideExcluded=false;
const isOurs=l=>!EXC[l.i];
const OURS=()=>RES.filter(isOurs);
function toggleOwn(i){ if(!requireWho())return; if(EXC[i])delete EXC[i]; else EXC[i]=1; paint(); renderSide(); pushLot(i); }
function togglePick(){ pickMode=!pickMode;

  document.getElementById('pickBtn').style.color=pickMode?'#fff':'#16232E'; }
function toggleHide(){ hideExcluded=!hideExcluded;

async function excludeBlock(bl){ if(!requireWho())return; const t=RES.filter(l=>l.b===bl); t.forEach(l=>EXC[l.i]=1); paint(); renderSide(); for(const l of t) await pushLot(l.i); }
async function includeAll(){ if(!requireWho())return; const was=Object.keys(EXC).map(Number); EXC={}; paint(); renderSide(); for(const i of was) await pushLot(i); }
function excList(){ return RES.filter(l=>!isOurs(l)).map(l=>l.b+'-'+l.l).sort(); }
let RES=[]; let byId={};

/* ---------- monotony ---------- */

const MRULES={
 r4:{n:'4 intervening residences',desc:'Same plan may not repeat unless at least 4 other homes sit between them along the street. Across-street not tested.',span:5,across:false},
 r3:{n:'3 intervening, both sides',desc:'Heights DCCR §3.12(l): the same plan and elevation may not repeat unless at least 3 other homes sit between them along the street, nor directly across the street. A DIFFERENT ELEVATION counts as sufficient dissimilarity — this follows the built record, where OCH built Addison A and Addison C two doors apart with City and HOA approval.',span:4,across:true,byElev:true},
 r2:{n:'2 lots either direction + across',desc:'Same plan may not repeat within 2 lots either side, nor directly across the street.',span:2,across:true},
 off:{n:'off',desc:'No monotony test applied.',span:0,across:false}
};
function setRule(v){monoRule=v;paint();renderSide();pushSetting('mono_rule',v);}
/* What counts as "the same home" for monotony differs by community.
   Grand Oaks compares the plan family: Campbell A/B/C all count as Campbell.
   The Heights compares plan AND elevation: its DCCR requires "sufficient
   dissimilarity", and the built record shows a different elevation satisfies
   that (Addison A and Addison C sit two doors apart, City- and HOA-approved). */
function planFamily(pid){
  if(!pid)return null;
  return MRULES[monoRule].byElev ? pid : PLAN[pid].n.split(' ')[0];
}
function walk(i,dir,steps){const out=[];let cur=i;
  for(let s=0;s<steps;s++){const nx=(MAP.adj[cur]||{})[dir]; if(nx===null||nx===undefined)break; out.push(nx); cur=nx;}
  return out;}
function monoNeighbors(i){
  const R=MRULES[monoRule]; if(R.span===0)return [];
  let n=[...walk(i,'L',R.span),...walk(i,'R',R.span)];
  if(R.across){const a=(MAP.adj[i]||{}).A; if(a!==null&&a!==undefined)n.push(a);}
  return n;
}
/* confidence of this lot's across-street pairing, when the data records it */
function acrossConf(i){ return (MAP.adj[i]||{}).aConf || null; }
function acrossIs(i,j){ return (MAP.adj[i]||{}).A===j; }
function monoConflict(i,pid){
  if(!pid)return [];
  const fam=planFamily(pid);
  return monoNeighbors(i).filter(j=>A[j]&&planFamily(A[j])===fam)
    .map(j=>({i:j,lot:byId[j].b+'-'+byId[j].l,plan:PLAN[A[j]].n,
              across:acrossIs(i,j), conf:acrossIs(i,j)?acrossConf(i):null}));
}
/* ---------- analysis ---------- */
function lotProduct(l){
  if(l.prod===undefined||l.prod===null)return null;
  if(typeof l.prod==='number')return l.prod;
  const m=String(l.prod).match(/(\d{2})/);      /* tolerate "MR 45' RE" style */
  return m?parseInt(m[1],10):null;
}
/* Lot products present in this community, ascending. Communities differ:
   Grand Oaks has 50/60/70, The Heights is all 45. */
let _prodCache=null;
function communityProducts(){
  if(_prodCache)return _prodCache;
  const s=new Set();
  MAP.lots.forEach(l=>{const p=lotProduct(l); if(p!=null)s.add(p);});
  _prodCache=[...s].sort((a,b)=>a-b);
  return _prodCache;
}
const PROD_PALETTE=['#4E79A7','#59A14F','#B07AA1','#F28E2B','#76B7B2'];
function productColors(){
  const o={}; communityProducts().forEach((p,i)=>{o[p]=PROD_PALETTE[i%PROD_PALETTE.length];});
  return o;
}
function estLotWidth(l){return l.lw!==undefined?Math.round(l.lw):Math.round(l.a/120);}
function fitsLot(l,p){const pr=lotProduct(l);
  if(pr===null)return true;
  return p.lot<=pr;}
function planVerdict(l,p){
  const reasons=[];
  const warnMissing=[];
  const pr=lotProduct(l);
  if(pr!==null&&p.lot>pr) reasons.push(`needs a ${p.lot}' lot — this is a ${pr}'`);
  /* evalLot returns null where the front-entry driveway maths cannot run:
     rear-alley lots (no front spot elevation) and plans with no measured depth.
     Those checks are simply unavailable — never treat that as a pass or a fail. */
  const ev=evalLot(l,p.id);
  if(ev===null){
    if(p.d==null||p.w==null) warnMissing.push('dimensions not measured');
    else warnMissing.push('driveway check not applicable');
  }
  if(ev&&!ev.pass) reasons.push(`driveway ${ev.slope.toFixed(1)}% even set back ${ev.setback.toFixed(1)}' — needs a ${ev.dg.toFixed(2)}' drop garage`);
  if(ev&&ev.hand==='no') reasons.push('J-swing hand cannot match the required driveway side');
  const mc=monoConflict(l.i,p.id);
  if(mc.length) reasons.push('monotony: '+mc.map(x=>x.plan+' at '+x.lot).join(', '));
  const warn=warnMissing.slice();
  if(ev&&ev.hand==='mirror') warn.push('mirror required');
  return {ok:reasons.length===0,reasons:reasons,warn:warn,ev:ev,mono:mc};
}
function evalLot(l,pid){
  const p=pid?PLAN[pid]:null;
  /* Heights plans have no measured depth and rear-alley lots carry no
     front-spot elevation. Depth-based fit maths cannot run — return null
     rather than compute with missing values. */
  if(p&&(p.d===null||p.d===undefined))return null;
  if(l.fs===undefined||l.fs===null||l.shift===undefined)return null;
  const maxShift=p?rearShiftOf(p):0;
  const run=BASE_RUN+ (p? Math.min(maxShift, Math.max(0,l.shift)) :0);
  const rise=l.fp+SLAB-l.fs;
  const slope=rise/run*100;
  const stepNeed=rise-(MAXG/100)*run;
  const dg=Math.max(0,stepNeed-STD_STEP);
  let hand='ok',handTxt='';
  if(p&&p.gar==='J-swing'&&l.drvReq){
    if(p.hand===l.drvReq){hand='ok';handTxt='as drawn';}
    else if(p.mirror){hand='mirror';handTxt='mirror required';}
    else {hand='no';handTxt='hand conflict';}
  }
  return {run:run,slope:slope,dg:dg,setback:Math.max(0,Math.min(maxShift,l.shift)),
          shortfall:Math.max(0,l.shift-maxShift),hand:hand,handTxt:handTxt,
          pass:slope<=MAXG+1e-9,maxShift:maxShift};
}
function statusOf(l){
  const pid=A[l.i];
  if(pid&&monoConflict(l.i,pid).length)return 'fail';
  if(l.fs===undefined||l.fs===null){          /* rear-alley community */
    if(l.sl21===undefined||l.sl21===null)return 'warn';
    return l.sl21>MAXG?'fail':'pass';
  }
  if(pid){
    if(monoConflict(l.i,pid).length)return 'fail';
    const e=evalLot(l,pid);
    if(e===null)return 'pass';          /* driveway maths not applicable here */
    if(!e.pass&&e.dg>0)return e.shortfall>0?'fail':'warn';
    return e.hand==='no'?'fail':(e.hand==='mirror'?'warn':'pass');}
  if(l.shift<=0)return 'pass';
  if(l.shift<=15.5)return 'warn';
  return 'fail';
}

/* ---------- color ---------- */
let CM=['slope','remedy','product','driveway','confidence','plan'];
const CM_RECORD=['ownership','product','driveway','plan'];
function modes(){return RECORD?CM_RECORD:CM;}
function colorOf(l){
  if(l.type!=='Residential')return '#E4E7E9';
  if(RECORD){
    const mode=modes()[colorMode];
    if(mode==='ownership'){
      if(l.model)return '#2E4A63';
      if(l.own)return '#2F7D5A';
      return '#E8EBED';
    }
    if(mode==='product'){const pr=l.prod;
      return pr===50?'#4E79A7':pr===60?'#59A14F':pr===70?'#B07AA1':'#D5D9DC';}
    if(mode==='driveway')return l.drvReq==='left'?'#4E79A7':l.drvReq==='right'?'#B8791E':'#DCE0E2';
    if(!l.own)return '#E8EBED';
    const PC={marshall_c:'#4E79A7',marshall_b:'#76B7B2',ellis_d:'#F28E2B',ellis_b:'#EDC948',dakota_a:'#9C755F'};
    return PC[l.plan]||'#8A959C';
  }
  if(colorMode===0){const s=l.sl21;
    return s<=8?'#2F7D5A':s<=10?'#7FA86B':s<=12?'#B8791E':'#A6392E';}
  if(colorMode===1){
    if(l.shift<=0)return '#2F7D5A';
    if(l.shift<=2)return '#9CBE7A';
    if(l.shift<=4)return '#D9C15C';
    if(l.shift<=15.5)return '#B8791E';
    return '#A6392E';}
  if(colorMode===2){const pr=lotProduct(l);
    return (pr!==null&&productColors()[pr])||'#D5D9DC';}
  if(colorMode===3)return l.drvReq==='LEFT'?'#4E79A7':l.drvReq==='RIGHT'?'#B8791E':'#DCE0E2';
  if(colorMode===4)return l.conf==='OK'?'#2F7D5A':'#B8791E';
  const pid=A[l.i];
  if(!pid)return '#E8EBED';
  if(monoConflict(l.i,pid).length)return '#A6392E';
  return planColors()[planBase(pid)]||'#8A959C';
}
/* Plan family for DISPLAY. Deliberately separate from planFamily(), which is
   rule-dependent (Heights compares plan+elevation). Map colour must never
   change just because the monotony rule changed. */
function planBase(pid){ return pid&&PLAN[pid] ? PLAN[pid].n.split(' ')[0] : null; }

/* Colours are assigned to whichever plans this community actually uses, not
   to a hard-coded list. Heights is rear-entry (Addison, Carmichael, ...),
   Grand Oaks front-entry (Campbell, Cooper, ...) — one list cannot serve both. */
const PALETTE=['#4E79A7','#F28E2B','#59A14F','#B07AA1','#76B7B2','#EDC948','#9C755F',
               '#2E4A63','#B8791E','#7FA86B','#8C6BB1','#D95F6B'];
let _pcCache=null;
/* Which plans a community offers comes from the Community Offerings matrix in
   the plan library, carried in meta.offers — NOT inferred from garage type.
   Offerings are keyed by lot product where a community has several (Grand Oaks
   50'/60'/70'), or a flat list where every lot is one product (The Heights 45').
   Falls back to garage type only if a community has no offers recorded. */
function offeredFor(l){
  const o=(MAP.meta||{}).offers;
  if(!o) {
    const rear=MAP.lots.some(x=>x.ap===undefined||x.ap===null);
    return PLANS.filter(p=>rear ? p.gar==='Rear' : p.gar!=='Rear').map(p=>p.id);
  }
  if(Array.isArray(o)) return o;
  const pr=l?lotProduct(l):null;
  if(pr!=null && o[String(pr)]) return o[String(pr)];
  return Object.values(o).flat();
}
function communityFamilies(){
  const seen=[];
  offeredFor(null).forEach(id=>{
    const p=PLAN[id]; if(!p)return;
    const f=p.n.split(' ')[0];
    if(!seen.includes(f))seen.push(f);
  });
  return seen;
}
function planColors(){
  if(_pcCache)return _pcCache;
  _pcCache={};
  communityFamilies().forEach((f,i)=>{_pcCache[f]=PALETTE[i%PALETTE.length];});
  return _pcCache;
}
const LEGENDS=[
 ['Driveway slope @ {RUN} ft run',[['#2F7D5A','under 8%'],['#7FA86B','8–10%'],['#B8791E','10–12%'],['#A6392E','over 12%']]],
 ['Remedy needed',[['#2F7D5A','none — passes'],['#9CBE7A','set back ≤2 ft'],['#D9C15C','2–4 ft'],['#B8791E','4–15.5 ft'],['#A6392E','drop garage only']]],
 ['Lot product',null],
 ['Restricted driveway side',[['#4E79A7','must be LEFT'],['#B8791E','must be RIGHT'],['#DCE0E2','unrestricted']]],
 ['Data confidence',[['#2F7D5A','OK'],['#B8791E','CHECK — verify']]],
 ['Assigned plan',null]   /* built at render time from this community's plans */
];
const LEGENDS_RECORD=[
 ['OCH ownership',[['#2E4A63','model home'],['#2F7D5A','OCH spec'],['#E8EBED','not an OCH lot']]],
 ['Lot product',null],
 ['Driveway side required',[['#4E79A7','left'],['#B8791E','right'],['#DCE0E2','unrestricted']]],
 ['Plan built',[['#4E79A7','Marshall C'],['#76B7B2','Marshall B'],['#F28E2B','Ellis D'],['#EDC948','Ellis B'],['#9C755F','Dakota A'],['#E8EBED','not an OCH lot']]]
];
function drawLegend(){

function centroid(pts){let x=0,y=0;pts.forEach(p=>{x+=p[0];y+=p[1]});return [x/pts.length,y/pts.length];}

function setVB(){svg.setAttribute('viewBox',`${vb.x} ${vb.y} ${vb.w} ${vb.h}`);}

function zoom(f,cx,cy){
  const r=svg.getBoundingClientRect();

     construction set, so there is no estimate. Show "—", never a fake number. */
  const slopeVal = e ? e.slope : (l.sl21!=null ? l.sl21 : null);
  h+=`<div class="card2" style="margin-top:12px"><div style="display:flex;justify-content:space-between;align-items:flex-end">
      <div><div class="muted" style="font-size:11px;text-transform:uppercase;letter-spacing:.5px">Driveway slope @ ${e?e.run.toFixed(1):BASE_RUN} ft</div>
      <div class="big" style="color:${slopeVal==null?'var(--slate)':(slopeVal<=MAXG?'var(--pass)':'var(--fail)')}">${slopeVal==null?'—':slopeVal.toFixed(1)+'%'}</div></div>
      <div>${st==='pass'?pill('pass','OK'):st==='warn'?pill('warn','NEEDS WORK'):pill('fail','PROBLEM')}</div></div>
      ${slopeVal==null?`<div class="muted" style="font-size:11px;margin-top:6px">No rear grade recorded for this lot — slope cannot be estimated.</div>`:''}</div>`;
  /* Front-entry communities carry apron + front-spot elevations. Rear-alley
     communities (The Heights) do not — they have pad, rear grade and drop only.
     Branch rather than assume; the fields are genuinely absent, not zero. */
  const rearEntry = (l.ap===undefined||l.ap===null);
  if(!rearEntry){
    h+=`<h3 class="sh">Elevations</h3><div class="kv">
      <span class="k">Pad (FP)</span><span class="v">${l.fp.toFixed(2)}</span>
      <span class="k">Top of slab (+0.83)</span><span class="v">${(l.fp+SLAB).toFixed(2)}</span>
      <span class="k">Garage apron</span><span class="v">${l.ap.toFixed(2)}</span>
      <span class="k">Front spot at ROW</span><span class="v">${l.fs.toFixed(2)}</span>
      <span class="k">Driveway drop</span><span class="v">${l.drop.toFixed(2)} ft</span></div>`;
  } else {
    h+=`<h3 class="sh">Elevations</h3><div class="kv">
      <span class="k">Finished pad (FP)</span><span class="v">${l.fp!=null?l.fp.toFixed(1):'—'}</span>
      <span class="k">Rear grade at alley</span><span class="v">${l.dg!=null?l.dg.toFixed(1):'—'}</span>
      <span class="k">Pad → rear drop</span><span class="v">${l.drop!=null?l.drop.toFixed(1)+' ft':'—'}</span></div>`;
    if(l.wall){
      const exp = (l.wexp!=null)?l.wexp:((l.tw!=null&&l.bw!=null)?(l.tw-l.bw):null);
      h+=`<h3 class="sh">Retaining wall</h3><div class="kv">
        <span class="k">Top of wall (TW)</span><span class="v">${l.tw!=null?l.tw.toFixed(1):'—'}</span>
        <span class="k">Bottom of wall (BW)</span><span class="v">${l.bw!=null?l.bw.toFixed(1):'—'}</span>
        <span class="k">Exposed height</span><span class="v">${exp!=null?exp.toFixed(1)+' ft':'not recorded'}</span></div>`;
      if(exp!=null&&exp>4)
        h+=`<div class="remedy" style="border-left-color:var(--warn)"><b>Engineered wall required.</b><br>
          Exposed height ${exp.toFixed(1)} ft exceeds 4 ft (Celina §9.05). Build around the existing wall.</div>`;
    }
    if(l.sl21!=null&&l.sl21>MAXG)
      h+=`<div class="remedy" style="border-left-color:var(--fail)"><b>Estimated driveway slope ${l.sl21.toFixed(1)}% exceeds ${MAXG}%.</b><br>
        Estimate only — (pad − rear grade) ÷ ${BASE_RUN} ft apron. Verify against the alley profile before relying on it.</div>`;
  }
  if(!rearEntry) h+=`<h3 class="sh">To reach 10%</h3><div class="kv">
      <span class="k">Required driveway length</span><span class="v">${l.need.toFixed(1)} ft</span>
      <span class="k">Shift home back</span><span class="v">${l.shift>0?l.shift.toFixed(1)+' ft':'—'}</span>
      <span class="k">Drop garage if not</span><span class="v">${l.dg>0?'+'+l.dg.toFixed(2)+' ft':'—'}</span></div>`;
  if(l.drvReq)h+=`<div class="remedy"><b>Restricted driveway.</b> Must be on the <b>${l.drvReq}</b> side, viewed from the street. J-swing plans must match this hand or be mirrored.</div>`;
  h+=`<h3 class="sh">Plan fit</h3>`;
  h+=`<select id="assign" onchange="assignPlan(${l.i},this.value)" style="width:100%;padding:7px;font-family:'IBM Plex Mono';font-size:12px;border:1px solid var(--line);border-radius:4px">
      <option value="">— no plan assigned —</option>`;
  /* only offer plans that match the community's entry type */
  const offered = offeredFor(l);
  const retired = (MAP.meta&&MAP.meta.retiredPlans)||[];
  PLANS.filter(p=>offered.includes(p.id) || pid===p.id)   /* an already-assigned plan stays visible even if withdrawn */
       .filter(p=>!retired.includes(p.id) || pid===p.id)
       .forEach(p=>{h+=`<option value="${p.id}" ${pid===p.id?'selected':''}>${p.n} · ${p.coll}${p.d==null?' · dims not measured':''}</option>`});
  h+='</select>';
  /* Rear-alley depth fit, calibrated against the built record 9/15/26:
       lot depth >= plan depth + front BL + rear-to-alley - porch encroachment
     The porch may encroach into the front building line, so it does not consume
     buildable depth. All 22 built Heights homes pass; the tightest (Addison B at
     713 Lincoln Mews) clears by 0.6 ft. Without the porch credit, 10 of them
     would read as impossible — which is how the credit was discovered. */
  if(pid&&rearEntry&&PLAN[pid]){
    const P=PLAN[pid], M=(MAP.meta||{});
    const fbl=M.frontBL!=null?M.frontBL:10, rear=M.rearBL!=null?M.rearBL:20,
          porch=M.porchEncroach!=null?M.porchEncroach:5;
    if(P.d!=null && l.ld!=null){
      const need=P.d+fbl+rear-porch, marg=l.ld-need;
      const cls = marg<0?'fail':(marg<2?'warn':'pass');
      h+=`<h3 class="sh">Depth fit</h3><div class="kv">
        <span class="k">Lot depth</span><span class="v">${l.ld.toFixed(0)}'</span>
        <span class="k">Plan depth</span><span class="v">${P.d.toFixed(1)}'</span>
        <span class="k">Front BL + rear to alley</span><span class="v">${fbl}' + ${rear}'</span>
        <span class="k">Porch encroachment credit</span><span class="v">−${porch}'</span>
        <span class="k">Required</span><span class="v">${need.toFixed(1)}'</span>
        <span class="k">Margin</span><span class="v" style="color:var(--${cls})">${marg>=0?'+':''}${marg.toFixed(1)}'</span></div>`;
      if(marg<0)h+=`<div class="remedy" style="border-left-color:var(--fail)"><b>Does not fit on depth.</b><br>
        Short by ${Math.abs(marg).toFixed(1)} ft. Lot depth is derived from the plat polygon, so verify against survey before ruling it out.</div>`;
      else if(marg<2)h+=`<div class="remedy" style="border-left-color:var(--warn)"><b>Tight — ${marg.toFixed(1)} ft margin.</b><br>
        Within the tolerance of a plat-derived lot depth. Confirm against survey.</div>`;
    } else if(P.d==null){
      h+=`<div class="remedy" style="border-left-color:var(--warn)"><b>Depth fit unavailable.</b><br>${P.n} has no measured depth on file.</div>`;
    }
  }
  if(e){
    h+=`<div class="card2" style="margin-top:10px"><div class="kv">
      <span class="k">Plan depth / max rear shift</span><span class="v">${PLAN[pid].d!=null?PLAN[pid].d.toFixed(1):'not measured'}' / ${e.maxShift.toFixed(1)}'</span>
      <span class="k">Home shifted back</span><span class="v">${e.setback.toFixed(1)} ft</span>
      <span class="k">Resulting driveway length</span><span class="v">${e.run.toFixed(1)} ft</span>
      <span class="k">Resulting slope</span><span class="v" style="color:${e.pass?'var(--pass)':'var(--fail)'}">${e.slope.toFixed(1)}%</span>
      ${e.dg>0?`<span class="k">Drop garage still needed</span><span class="v" style="color:var(--fail)">+${e.dg.toFixed(2)} ft</span>`:''}
      ${e.handTxt?`<span class="k">J-swing hand</span><span class="v">${e.handTxt}</span>`:''}
      </div></div>`;
    const mc=monoConflict(l.i,pid);
    if(mc.length)h+=`<div class="remedy" style="border-left-color:var(--fail)"><b>Monotony conflict.</b><br>
      ${PLAN[pid].n.split(' ')[0]} also at ${mc.map(x=>'<b>'+(byId[x.i]&&byId[x.i].addr?byId[x.i].addr:x.lot)+'</b> ('+x.plan+(x.across?', across the street':'')+')').join(', ')}.<br>
      <span class="muted">Rule in force: ${MRULES[monoRule].n}</span></div>`;
    else if(monoRule!=='off')h+=`<div class="remedy" style="border-left-color:var(--pass)"><b>Monotony clear</b> under “${MRULES[monoRule].n}”.
      <span class="muted">Checked ${monoNeighbors(l.i).length} neighboring lots.</span></div>`;
  }
  /* Only weigh plans this community actually offers for this lot's product. */
  const offeredIds=offeredFor(l);
  const verd=PLANS.filter(p=>offeredIds.includes(p.id)).map(p=>({p:p,v:planVerdict(l,p)}));
  const good=verd.filter(x=>x.v.ok), bad=verd.filter(x=>!x.v.ok);
  const nb=MAP.adj[l.i]||{};
  const nm=x=>x===null||x===undefined?'—':`<a href="#" onclick="select(${x});return false">${byId[x].b}-${byId[x].l}</a>`
      +(A[x]?` <span class="muted">${PLAN[A[x]].n}</span>`:'');
  h+=`<h3 class="sh">Neighbors</h3><div class="kv">
     <span class="k">Left</span><span class="v">${nm(nb.L)}</span>
     <span class="k">Right</span><span class="v">${nm(nb.R)}</span>
     <span class="k">Across street</span><span class="v">${nm(nb.A)}</span></div>`;
  h+=`<h3 class="sh">Plans that fit — ${good.length}</h3>`;
  if(good.length){
    /* Front-entry lots are judged on driveway geometry; rear-alley lots on
       width and depth against the buildable envelope. Different columns,
       because the front-entry numbers do not exist on a rear-alley lot. */
    const M=MAP.meta||{};
    const dmar=p=>{
      if(p.d==null||l.ld==null)return null;
      const fbl=M.frontBL!=null?M.frontBL:10, rear=M.rearBL!=null?M.rearBL:20,
            porch=M.porchEncroach!=null?M.porchEncroach:5;
      return l.ld-(p.d+fbl+rear-porch);
    };
    const wmar=p=>(p.w==null||M.buildableWidth==null)?null:M.buildableWidth-p.w;
    h+= rearEntry
      ? `<table class="pl"><thead><tr><th>Plan</th><th>Width</th><th>Depth</th><th>Width margin</th><th>Depth margin</th></tr></thead><tbody>`
      : `<table class="pl"><thead><tr><th>Plan</th><th>Lot</th><th>Max shift</th><th>Shift</th><th>Slope</th></tr></thead><tbody>`;
    good.forEach(x=>{
      const tag=x.v.warn.length?' <span class="pill p-warn">'+x.v.warn.join(', ')+'</span>':'';
      h+=`<tr style="cursor:pointer" onclick="assignPlan(${l.i},'${x.p.id}')"><td><b>${x.p.n}</b>${tag}</td>`;
      if(rearEntry){
        const wm=wmar(x.p), dm=dmar(x.p);
        h+=`<td>${x.p.w!=null?x.p.w.toFixed(1)+"'":'—'}</td>
            <td>${x.p.d!=null?x.p.d.toFixed(1)+"'":'—'}</td>
            <td${wm!=null?` style="color:var(--${wm<0?'fail':(wm<1?'warn':'pass')})"`:''}>${wm!=null?(wm>=0?'+':'')+wm.toFixed(1)+"'":'—'}</td>
            <td${dm!=null?` style="color:var(--${dm<0?'fail':(dm<2?'warn':'pass')})"`:''}>${dm!=null?(dm>=0?'+':'')+dm.toFixed(1)+"'":'—'}</td></tr>`;
      } else {
        const e=x.v.ev;
        h+=`<td>${x.p.lot}'</td>
            <td>${e?e.maxShift.toFixed(1)+"'":'—'}</td>
            <td>${e?e.setback.toFixed(1)+"'":'—'}</td>
            <td style="color:var(--pass)">${e?e.slope.toFixed(1)+'%':'—'}</td></tr>`;
      }
    });
    h+='</tbody></table><p class="muted" style="margin-top:5px">Click a row to assign it.</p>';
  } else h+=`<p class="muted">No offered plan currently fits this lot.</p>`;
  h+=`<h3 class="sh">Plans that do not fit — ${bad.length}</h3>`;
  h+=`<table class="pl"><thead><tr><th>Plan</th><th style="text-align:left">Why not</th></tr></thead><tbody>`;
  bad.forEach(x=>{h+=`<tr class="no"><td><b>${x.p.n}</b></td>
     <td style="text-align:left;white-space:normal">${x.v.reasons.join('<br>')}</td></tr>`});
  h+='</tbody></table>';
  h+=backBtn();
  el.innerHTML=h;
}

  const blob=new Blob([JSON.stringify(st,null,1)],{type:'application/json'});

function importState(ev){
  const f=ev.target.files[0]; if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{try{const st=JSON.parse(rd.result);
    if(st.assigned){A=st.assigned;}
    if(st.excluded){EXC=st.excluded;}
    cacheLocal();
    if(SB.on()&&confirm('Also push these to the shared database for everyone?')){
      (async()=>{for(const i of Object.keys(byId).map(Number)) if(A[i]||EXC[i]) await pushLot(i);})();
    }
    if(st.rule){monoRule=st.rule;}
    sel=null;paint();renderSide();alert('Loaded '+Object.keys(A).length+' plan assignments.');
  }catch(e){alert('Could not read that file.')}};
  rd.readAsText(f);
}

   <span class="k">Excluded</span><span class="v">${exn}</span></div>`;
  if(exn){h+=`<div class="card2" style="margin-top:8px"><div class="muted" style="font-size:11px;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px">Excluded lots</div>
    <div style="font-family:'IBM Plex Mono',monospace;font-size:11.5px;line-height:1.7">${excList().join(' · ')}</div>
    <div style="margin-top:8px"><a href="#" onclick="copyExc();return false" class="muted">copy list</a> · <a href="#" onclick="includeAll();return false" class="muted">reset all</a></div></div>`;}
  else h+=`<p class="muted" style="margin-top:6px">No lots excluded yet — all ${RES.length} are counted.</p>`;
  h+=`<h3 class="sh">How a lot is judged</h3>
   <p style="font-size:13px">Garage apron sits ${SLAB} ft above pad less the ${STD_STEP} ft step-down. The driveway falls from there to the front spot elevation at the right-of-way. Slope is that drop over the driveway length — and that length grows as the home shifts toward the rear of the pad.</p>
   <p style="font-size:13px">A shallower plan leaves more room behind it, so it can shift further back — a longer driveway, a gentler slope, and no drop garage needed.</p>`;
  const pm={50:0,60:0,70:0,0:0}; O.forEach(l=>pm[l.prod||0]++);
  h+=`<h3 class="sh">Monotony rule</h3>
   <select onchange="setRule(this.value)" style="width:100%;padding:7px;font-family:'IBM Plex Mono';font-size:12px;border:1px solid var(--line);border-radius:4px">
     ${Object.entries(MRULES).map(([k,v])=>`<option value="${k}" ${monoRule===k?'selected':''}>${v.n}</option>`).join('')}
   </select>
   <p class="muted" style="margin-top:6px">${MRULES[monoRule].desc}</p>
   <p class="muted"><b>Two source documents conflict on this.</b> Confirm which governs at Grand Oaks before relying on it — the tool applies whichever you pick here.</p>`;
  const conf=O.filter(l=>A[l.i]&&monoConflict(l.i,A[l.i]).length);
  const asg=O.filter(l=>A[l.i]);
  h+=`<div class="kv" style="margin-top:8px"><span class="k">Plans assigned</span><span class="v">${asg.length} / ${n}</span>
   <span class="k" style="${conf.length?'color:var(--fail)':''}">Monotony conflicts</span>
   <span class="v" style="${conf.length?'color:var(--fail)':''}">${conf.length}</span></div>`;
  if(conf.length)h+=`<div class="card2" style="margin-top:8px"><div style="font-family:'IBM Plex Mono',monospace;font-size:11.5px;line-height:1.8">
    ${conf.map(l=>`<a href="#" onclick="select(${l.i});return false">${l.b}-${l.l}</a>`).join(' · ')}</div></div>`;
  h+=`<h3 class="sh">Lot product mix</h3><div class="kv">`
    + communityProducts().map(p=>`<span class="k">${p}' lots</span><span class="v">${pm[p]||0}</span>`).join('')
    + `${pm[0]?`<span class="k" style="color:var(--warn)">product not set</span><span class="v" style="color:var(--warn)">${pm[0]}</span>`:''}</div>`;
  h+=`<h3 class="sh">How far each plan can shift back</h3><table class="pl"><thead><tr><th>Plan</th><th>Depth</th><th>Max rear shift</th><th>Lots it solves</th></tr></thead><tbody>`;
  [...PLANS].sort((a,b)=>rearShiftOf(b)-rearShiftOf(a)).forEach(p=>{
    const s=rearShiftOf(p), solv=O.filter(l=>l.shift<=s).length;
    h+=`<tr><td>${p.n}</td><td>${p.d.toFixed(1)}'</td><td>${s.toFixed(1)}'</td><td>${solv}/${n}</td></tr>`;});
  h+='</tbody></table>';
  if(chk)h+=`<div class="remedy" style="border-left-color:var(--warn);margin-top:14px"><b>${chk} OCH lots flagged CHECK.</b> Their front spot elevation could not be confirmed — switch the color mode to “confidence” to find them.</div>`;
  h+=`<h3 class="sh">Recent changes</h3><div id="histBox" class="muted">loading…</div>`;
  setTimeout(async()=>{
    const el=document.getElementById('histBox'); if(!el)return;
    if(!SB.on()){el.innerHTML='<span class="muted">No shared database configured — history is only kept when the tool is connected.</span>';return;}
    const rows=await loadHistory();
    if(!rows.length){el.innerHTML='<span class="muted">No changes recorded yet.</span>';return;}
    el.innerHTML='<table class="pl"><thead><tr><th>When</th><th>Lot</th><th style="text-align:left">Change</th><th>By</th></tr></thead><tbody>'+
      rows.map(r=>{const d=new Date(r.changed_at);
        const pn=v=>v&&PLAN[v]?PLAN[v].n:(v||'—');
        const what=r.field==='plan_id'?pn(r.old_value)+' &rarr; '+pn(r.new_value)
                 :r.field==='excluded'?(r.new_value==='true'?'removed from program':'put back in program')
                 :r.field;
        return `<tr><td>${d.toLocaleDateString()} ${d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}</td>
          <td>${r.block?r.block+'-'+r.lot:'—'}</td><td style="text-align:left;white-space:normal">${what}</td>
          <td>${r.changed_by||'—'}</td></tr>`}).join('')+'</tbody></table>';
  },0);
  h+=`<h3 class="sh">Save / share</h3>
   <p style="font-size:13px" id="shareTxt"></p>
   <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
     <button onclick="exportState()" style="font-family:'IBM Plex Mono';font-size:12px;padding:6px 11px;border:1px solid var(--line);border-radius:4px;background:#fff;cursor:pointer">export</button>
     <label style="font-family:'IBM Plex Mono';font-size:12px;padding:6px 11px;border:1px solid var(--line);border-radius:4px;background:#fff;cursor:pointer">
       import<input type="file" accept="application/json" onchange="importState(event)" style="display:none"></label>
   </div>`;
  if(assigned)h+=`<p class="muted" style="margin-top:12px">${assigned} lot${assigned>1?'s':''} assigned. <a href="#" onclick="clearAll();return false">clear all</a></p>`;
  return h;
}
function tagOurs(){const el=document.getElementById('tagOurs');
  const n=OURS().length; el.textContent=n+' of '+RES.length+' lots';}
const _paint=paint; paint=function(){_paint();tagOurs();};
async function boot(){
  const st=document.getElementById('side');
  try{
    const r=await fetch('../data/'+COMMUNITY+'.json',{cache:'no-store'});
    if(!r.ok)throw new Error('data file not found ('+r.status+')');
    MAP=await r.json();
  }catch(e){
    document.getElementById('commName').textContent='Lot data not found';
    document.getElementById('commSub').textContent=e.message;
    st.innerHTML='<div class="remedy" style="border-left-color:var(--fail)">'+
      '<b>Could not load the lot data.</b><br>'+e.message+
      '<br><br>The tool looked for <code>../data/'+COMMUNITY+'.json</code> relative to this page, i.e.<br>'+
      '<code>'+new URL('../data/'+COMMUNITY+'.json',location.href).pathname+'</code>'+
      '<br><br>Open that address directly. If it 404s, the <code>data</code> folder did not upload, '+
      'or a file name differs in capitalization. If it loads, tell me what it says.</div>';
    const tag=document.getElementById('syncTag');
    if(tag){tag.textContent='no data';tag.style.background='#F5E4E1';tag.style.color='#A6392E';}
    return;
  }
  RES=MAP.lots.filter(l=>l.type==='Residential');
  byId={}; MAP.lots.forEach(l=>byId[l.i]=l);
  applyMeta(MAP.meta);
  vb={x:0,y:0,w:MAP.w,h:MAP.h};
  build();
  if(RECORD){
    ['pickBtn','hideBtn'].forEach(id=>{const e=document.getElementById(id); if(e)e.style.display='none';});
  }
  colorMode=0; document.getElementById('cmBtn').textContent='color: '+modes()[0];
  drawLegend();
  if(WHO){const w=document.getElementById('whoTag'); if(w)w.textContent=WHO;}
  await pullAll();
  setInterval(()=>{if(SB.on()&&syncState!=='saving')pullAll();},60000);
  renderSide();tagOurs();
  document.getElementById('pickBtn').title='Turn on, then click lots to add or remove them from the OCH program';
}
boot();
</script>
</body>
