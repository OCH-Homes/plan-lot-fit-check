<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Heights at Uptown — Lot Fit, Grading &amp; Monotony</title>
<style>
  :root{--ink:#1a2b33;--paper:#f7f4ee;--line:#c9c0b0;--built:#5b7a8c;--avail:#e8e2d4;--pick:#c98a3a;
    --bad:#b23a48;--ok:#4f7a5b;--och:#2e4a63;--wall:#8a5a2b;--shadow:rgba(30,40,50,.14);}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);
    font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;}
  #app{display:grid;grid-template-columns:1fr 360px;height:100vh}
  @media(max-width:860px){#app{grid-template-columns:1fr;grid-template-rows:1fr auto}}
  header{position:absolute;top:0;left:0;padding:14px 20px;z-index:5;pointer-events:none}
  header h1{font-size:19px;margin:0;letter-spacing:.2px;font-weight:600}
  header .sub{font-size:12px;color:#6b6250;margin-top:2px;font-family:ui-monospace,Menlo,monospace}
  #mapwrap{position:relative;overflow:hidden;background:
    repeating-linear-gradient(0deg,transparent,transparent 39px,#ece4d6 39px,#ece4d6 40px),
    repeating-linear-gradient(90deg,transparent,transparent 39px,#ece4d6 39px,#ece4d6 40px),var(--paper);}
  svg{width:100%;height:100%;display:block;cursor:grab}svg.grabbing{cursor:grabbing}
  .lot{stroke:#8a8069;stroke-width:.6;vector-effect:non-scaling-stroke;transition:fill .12s}
  .lot.avail{fill:var(--avail)}.lot.built{fill:var(--built)}.lot.pick{fill:var(--pick)}
  .lot.nonoch{fill:#efeadf;opacity:.4}.lot.viol{stroke:var(--bad);stroke-width:2.4}
  .lot.sel{stroke:#111;stroke-width:2.6}.lot.wall{stroke:var(--wall);stroke-width:2}
  .lotlabel{font-family:ui-monospace,Menlo,monospace;font-size:8px;fill:#2a2a2a;text-anchor:middle;
    dominant-baseline:central;pointer-events:none;user-select:none}
  .lotlabel.on-dark{fill:#f2eee4}
  .blocklabel{font-family:"Iowan Old Style",Georgia,serif;font-weight:700;fill:#3a3222;opacity:.16;
    text-anchor:middle;dominant-baseline:central;pointer-events:none;user-select:none}
  aside{background:#fff;border-left:1px solid var(--line);overflow-y:auto;box-shadow:-2px 0 8px var(--shadow);z-index:4}
  .panel{padding:18px}
  .panel h2{font-size:15px;margin:0 0 2px;letter-spacing:.3px}
  .muted{color:#7a7160;font-size:12px}
  .stat{display:flex;justify-content:space-between;padding:5px 0;font-size:13px;border-bottom:1px solid #efeade}
  .stat b{font-family:ui-monospace,Menlo,monospace}
  .legend{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 4px}
  .legend span{display:inline-flex;align-items:center;gap:5px;font-size:11px}
  .sw{width:13px;height:13px;border-radius:2px;border:1px solid #8a8069}
  select,button{font:inherit}
  .row{display:flex;gap:8px;margin:8px 0}
  select{flex:1;padding:7px 8px;border:1px solid var(--line);border-radius:5px;background:#fbf9f4;font-size:13px}
  button{padding:7px 12px;border:1px solid var(--och);background:var(--och);color:#fff;border-radius:5px;cursor:pointer;font-size:13px}
  button.ghost{background:#fff;color:var(--och)}button:disabled{opacity:.4;cursor:not-allowed}
  .verdict{padding:9px 11px;border-radius:6px;margin:8px 0;font-size:12.5px;line-height:1.4}
  .verdict.ok{background:#eaf2ec;border:1px solid var(--ok);color:#2f5238}
  .verdict.bad{background:#f7e9ea;border:1px solid var(--bad);color:#7d2530}
  .verdict.warn{background:#fbf2e3;border:1px solid #c98a3a;color:#7a5320}
  .tag{display:inline-block;font-family:ui-monospace,Menlo,monospace;font-size:11px;background:#efeade;border-radius:4px;padding:1px 6px;margin:1px 2px 1px 0}
  .k{font-family:ui-monospace,Menlo,monospace;font-weight:700}
  .flags{font-size:12px;color:#7a7160;margin-top:6px;line-height:1.45}.flags b{color:var(--bad)}
  .gridbox{background:#faf8f3;border:1px solid #e5ddcc;border-radius:6px;padding:9px 11px;margin:8px 0;font-size:12.5px}
  .gridbox .gl{display:flex;justify-content:space-between;padding:2px 0}
  .gridbox .gl b{font-family:ui-monospace,Menlo,monospace}
  .zoombar{position:absolute;bottom:14px;left:14px;display:flex;gap:6px;z-index:5}
  .zoombar button{background:#fff;color:var(--ink);border:1px solid var(--line);width:34px;height:34px;padding:0;font-size:17px;box-shadow:0 1px 4px var(--shadow)}
  .toggles{position:absolute;top:14px;right:14px;z-index:5;display:flex;flex-direction:column;gap:5px;background:#fffdf8;border:1px solid var(--line);border-radius:7px;padding:8px 10px;font-size:12px;box-shadow:0 1px 5px var(--shadow)}
  .toggles label{display:flex;align-items:center;gap:6px;cursor:pointer}
  #sync{position:absolute;bottom:14px;right:14px;z-index:6;display:flex;align-items:center;gap:7px;
    background:#fffdf8;border:1px solid var(--line);border-radius:20px;padding:6px 13px;font-size:11.5px;
    box-shadow:0 1px 5px var(--shadow);font-family:ui-monospace,Menlo,monospace;cursor:default}
  #sync .dot{width:8px;height:8px;border-radius:50%;background:#bbb;flex:none}
  #sync.live .dot{background:var(--ok)} #sync.saving .dot{background:var(--pick)}
  #sync.off .dot{background:#bbb} #sync.err .dot{background:var(--bad)}
  #sync.err{border-color:var(--bad);color:var(--bad)}
  #sync .who{color:#8a8069}
  #banner{position:absolute;top:0;left:0;right:0;z-index:7;background:#7d2530;color:#fff;
    padding:7px 14px;font-size:12px;display:none;font-family:ui-monospace,Menlo,monospace}
  #banner.show{display:block}
</style></head><body>

  <div id="banner"></div>

/* ---- key mapping: "N-12" <-> block "N", lot 12 ---- */
function splitKey(k){
  const i = k.lastIndexOf('-');
  return { block: k.slice(0,i), lot: parseInt(k.slice(i+1), 10) };
}
const joinKey = (block, lot) => `${block}-${lot}`;

/* ---- plan_id mapping: "Addison"+"B" <-> "addison_b" ---- */
function toPlanId(plan, elev){
  if(!plan) return null;
  return elev ? `${plan.toLowerCase()}_${elev.toLowerCase()}` : plan.toLowerCase();
}
function fromPlanId(pid){
  if(!pid) return null;
  const i = pid.lastIndexOf('_');
  const rawPlan = i > 0 ? pid.slice(0,i) : pid;
  const rawElev = i > 0 ? pid.slice(i+1) : '';
  /* match case-insensitively against the real plan list so display
     names stay correct ("addison" -> "Addison") */
  const plan = Object.keys(DATA.plans).find(p => p.toLowerCase() === rawPlan) || null;
  return plan ? { plan, elev: rawElev.toUpperCase() } : null;
}

async function sbFetch(path, opts={}){
  const res = await fetch(`${SUPA.url}/rest/v1/${path}`, {
    ...opts,
    headers: {
      apikey: SUPA.key,
      Authorization: `Bearer ${SUPA.key}`,
      "Content-Type": "application/json",
      ...(opts.headers || {})
    }
  });
  if(!res.ok){
    const body = await res.text().catch(()=> "");
    throw new Error(`${res.status} ${res.statusText} — ${body.slice(0,200)}`);
  }
  return res.status === 204 ? null : res.json();
}

/* ---- pull: rebuild from built-seed, then apply remote on top ---- */
async function pullState({quiet=false} = {}){
  if(!wired()) return;
  if(!quiet) setSync('saving','syncing…');
  try{
    const rows = await sbFetch(
      `lot_state?community=eq.${encodeURIComponent(SUPA.community)}` +
      `&select=block,lot,plan_id,excluded,updated_at,updated_by`
    );

    Object.keys(state).forEach(k => delete state[k]);
    Object.entries(DATA.built).forEach(([k,v]) => state[k] = {plan:v[0], elev:v[1], built:true});

    let newest = null, newestBy = null, unknown = [];
    rows.forEach(r => {
      const key = joinKey(r.block, r.lot);
      const parsed = fromPlanId(r.plan_id);
      if(r.plan_id && !parsed){ unknown.push(`${key}=${r.plan_id}`); return; }
      if(parsed){
        /* built-ness is local knowledge, not a DB column */
        const isBuilt = Object.prototype.hasOwnProperty.call(DATA.built, key);
        state[key] = {plan:parsed.plan, elev:parsed.elev, built:isBuilt, _pick:!isBuilt};
      } else {
        delete state[key];
      }
      if(!newest || r.updated_at > newest){ newest = r.updated_at; newestBy = r.updated_by; }
    });

    banner(unknown.length
      ? `Unrecognised plan_id in shared state, ignored: ${unknown.join(', ')} — check the plan list.`
      : '');
    const t = new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
    setSync('live', `synced ${t}`, newestBy ? `· last by ${newestBy}` : '');
    draw();
  }catch(err){
    setSync('err','sync failed');
    banner(`Could not reach shared state: ${err.message} — changes are LOCAL ONLY and will be lost on reload.`);
    console.error('[sync] pull failed', err);
  }
}

/* ---- push one lot, serialized ---- */
function pushLot(lotKey, rec, prev){
  if(!wired()) return;
  const who = actor();
  const {block, lot} = splitKey(lotKey);
  const newPid = rec ? toPlanId(rec.plan, rec.elev) : null;
  const oldPid = prev ? toPlanId(prev.plan, prev.elev) : null;

  pushQueue = pushQueue.then(async () => {
    setSync('saving','saving…');
    try{
      if(newPid){
        await sbFetch('lot_state?on_conflict=community,block,lot', {
          method:'POST',
          headers:{ Prefer:'resolution=merge-duplicates,return=minimal' },
          body: JSON.stringify([{
            community: SUPA.community, block, lot,
            plan_id: newPid, excluded: false, updated_by: who
          }])
        });
      } else {
        await sbFetch(
          `lot_state?community=eq.${encodeURIComponent(SUPA.community)}` +
          `&block=eq.${encodeURIComponent(block)}&lot=eq.${lot}`,
          { method:'DELETE', headers:{ Prefer:'return=minimal' } }
        );
      }

      /* change_log, matching the existing convention:
         field='created' for a first assignment, 'plan_id' for a change */
      await sbFetch('change_log', {
        method:'POST',
        headers:{ Prefer:'return=minimal' },
        body: JSON.stringify([{
          community: SUPA.community, block, lot,
          field: oldPid ? 'plan_id' : 'created',
          old_value: oldPid, new_value: newPid,
          changed_by: who
        }])
      });

      banner('');
      setSync('live', `saved ${new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}`);
    }catch(err){
      setSync('err','save failed');
      banner(`Save failed for lot ${lotKey}: ${err.message} — this change is NOT saved. Reload to see true shared state.`);
      console.error('[sync] push failed', lotKey, err);
    }
  });
  return pushQueue;
}

  setInterval(() => { if(!document.hidden) pullState({quiet:true}); }, SUPA.pollMs);
  window.addEventListener('visibilitychange', () => { if(!document.hidden) pullState({quiet:true}); });
}

function drawLabels(byBlock){
  if(gtext)gtext.remove();gtext=document.createElementNS(NS,'g');svg.appendChild(gtext);
  Object.entries(byBlock).forEach(([bl,cs])=>{
    const cx=cs.reduce((a,c)=>a+c[0],0)/cs.length,cy=cs.reduce((a,c)=>a+c[1],0)/cs.length;
    const t=document.createElementNS(NS,'text');t.setAttribute('x',cx);t.setAttribute('y',H-cy);
    t.setAttribute('class','blocklabel');t.setAttribute('font-size',Math.min(90,30+cs.length*3));
    t.textContent=bl;gtext.appendChild(t);});
  Object.entries(DATA.lots).forEach(([key,v])=>{if(!OCH.has(key))return;
    const t=document.createElementNS(NS,'text');t.setAttribute('x',v.c[0]);t.setAttribute('y',H-v.c[1]);
    const s=state[key];t.setAttribute('class','lotlabel'+((s&&!s._pick)?' on-dark':''));
    t.textContent=key;gtext.appendChild(t);});
}
svg.addEventListener('click',e=>{const k=e.target.dataset&&e.target.dataset.key;if(k&&OCH.has(k)){sel=k;draw();}});
let drag=null;
svg.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,vx:view.x,vy:view.y};svg.classList.add('grabbing');});
window.addEventListener('pointerup',()=>{drag=null;svg.classList.remove('grabbing');});
window.addEventListener('pointermove',e=>{if(!drag)return;const r=svg.getBoundingClientRect();
  view.x=drag.vx-(e.clientX-drag.x)*view.w/r.width;view.y=drag.vy-(e.clientY-drag.y)*view.h/r.height;applyView();});
svg.addEventListener('wheel',e=>{e.preventDefault();const r=svg.getBoundingClientRect();
  const mx=view.x+(e.clientX-r.left)/r.width*view.w,my=view.y+(e.clientY-r.top)/r.height*view.h;
  const f=e.deltaY>0?1.12:0.89;view.w*=f;view.h*=f;
  view.x=mx-(e.clientX-r.left)/r.width*view.w;view.y=my-(e.clientY-r.top)/r.height*view.h;applyView();},{passive:false});
document.getElementById('zin').onclick=()=>{view.w*=.8;view.h*=.8;applyView();};
document.getElementById('zout').onclick=()=>{view.w*=1.25;view.h*=1.25;applyView();};
document.getElementById('zfit').onclick=()=>{view={x:-20,y:-20,w:W+40,h:H+40};applyView();};
document.getElementById('tWall').onchange=e=>{showWall=e.target.checked;draw();};
document.getElementById('tSlope').onchange=e=>{flagSlope=e.target.checked;draw();};

function gradingBox(key){
  const g=DATA.grading[key];if(!g)return '';
  let h='<div class="gridbox">';
  h+=`<div class="gl"><span>Finished pad (FP)</span><b>${g.pad.toFixed(1)}'</b></div>`;
  if(g.wall){
    h+=`<div class="gl"><span>Retaining wall</span><b>yes</b></div>`;
    if(g.tw!=null)h+=`<div class="gl"><span>&nbsp;&nbsp;top of wall</span><b>${g.tw.toFixed(1)}'</b></div>`;
    if(g.bw!=null)h+=`<div class="gl"><span>&nbsp;&nbsp;bottom of wall</span><b>${g.bw.toFixed(1)}'</b></div>`;
    if(g.wall_exposed!=null){const eng=g.wall_exposed>4;
      h+=`<div class="gl"><span>&nbsp;&nbsp;max exposed</span><b>${g.wall_exposed.toFixed(1)}'${eng?' ⚠':''}</b></div>`;}
  } else h+=`<div class="gl"><span>Retaining wall</span><b>none</b></div>`;
  if(g.drive_slope_est!=null){
    const over=g.slope_flag==='over';
    h+=`<div class="gl"><span>Driveway slope (est)</span><b style="color:${over?'var(--bad)':'inherit'}">~${g.drive_slope_est}%</b></div>`;
    h+=`<div class="gl"><span>&nbsp;&nbsp;pad → rear drop</span><b>${g.drop}'</b></div>`;
  }
  h+='</div>';
  return h;
}

function renderPanel(){
  const p=document.getElementById('panel');
  const total=OCH.size;let builtN=0,pickN=0,availN=0;
  OCH.forEach(k=>{const s=state[k];if(!s)availN++;else if(s._pick)pickN++;else builtN++;});
  const vc=[...viols].filter(k=>OCH.has(k)).length;
  const wallN=Object.values(DATA.grading).filter(g=>g.wall).length;
  const steepN=Object.values(DATA.grading).filter(g=>g.slope_flag==='over').length;
  if(!sel){
    p.innerHTML=`<h2>Overview</h2><div class="muted">Click any OCH lot to assign a plan and see fit, grading &amp; monotony.</div>
      <div style="margin:14px 0">
      <div class="stat"><span>OCH lots</span><b>${total}</b></div>
      <div class="stat"><span>Built (recorded)</span><b>${builtN}</b></div>
      <div class="stat"><span>New picks</span><b>${pickN}</b></div>
      <div class="stat"><span>Available</span><b>${availN}</b></div>
      <div class="stat"><span>Lots with retaining wall</span><b>${wallN}</b></div>
      <div class="stat"><span>Est. driveway slope &gt;10%</span><b style="color:${steepN?'var(--bad)':'var(--ok)'}">${steepN}</b></div>
      <div class="stat"><span>Monotony flags</span><b style="color:${vc?'var(--bad)':'var(--ok)'}">${vc}</b></div></div>
      <div class="legend">
      <span><i class="sw" style="background:var(--built)"></i>Built</span>
      <span><i class="sw" style="background:var(--pick)"></i>New pick</span>
      <span><i class="sw" style="background:var(--avail)"></i>Available</span>
      <span><i class="sw" style="border:2px solid var(--wall)"></i>Has wall</span>
      <span><i class="sw" style="border:2px solid var(--bad)"></i>Flag</span></div>
      <div class="flags" style="margin-top:14px">Pad &amp; wall elevations from the City-approved construction set (08/21/24).
      Driveway slope is an <b>estimate</b> (pad − rear grade ÷ 20' run) — verify steep lots against the alley profile.
      Monotony: Heights DCCR §3.12(l), 3 intervening lots both sides, adjacency from plat geometry.</div>`;
    return;
  }
  const s=state[sel];const isBuilt=s&&s.built;
  const plansList=Object.keys(DATA.plans);
  const curPlan=s?s.plan:'';const elevs=curPlan?DATA.plans[curPlan].elevs:[];const curElev=s?s.elev:'';
  const fit=curPlan?fitCheck(sel,curPlan):null;const vlist=violationsFor(sel);
  const g=DATA.grading[sel];
  p.innerHTML=`<h2>Lot <span class="k">${sel}</span></h2>
    <div class="muted">Block ${DATA.lots[sel].block} · ${DATA.lots[sel].area.toLocaleString()} sq ft · 45' wide (Cottage)</div>
    ${isBuilt?`<div class="tag" style="background:var(--built);color:#fff">BUILT — recorded</div>`:''}
    ${gradingBox(sel)}
    <div class="row"><select id="planSel"><option value="">— plan —</option>
      ${plansList.map(pl=>`<option ${pl===curPlan?'selected':''} value="${pl}">${pl}${DATA.plans[pl].retired?' (retired)':''}</option>`).join('')}</select>
      <select id="elevSel"><option value="">elev</option>
      ${elevs.map(el=>`<option ${el===curElev?'selected':''} value="${el}">${el}</option>`).join('')}</select></div>
    <div class="row"><button id="assignBtn">${isBuilt?'Update':'Assign'}</button>
      <button class="ghost" id="clearBtn" ${s?'':'disabled'}>Clear</button></div>
    ${fit?`<div class="verdict ${fit.ok?'ok':'bad'}">${fit.msgs.map(m=>`<div>${m}</div>`).join('')}</div>`:''}
    ${g&&g.slope_flag==='over'?`<div class="verdict warn">Estimated driveway slope ~${g.drive_slope_est}% exceeds Celina's 10% max — verify against the alley profile before finalizing.</div>`:''}
    ${g&&g.wall_exposed>4?`<div class="verdict warn">Retaining wall exposed ~${g.wall_exposed.toFixed(1)}' (&gt;4') — engineered wall per Celina §9.05; build around existing wall.</div>`:''}
    ${curPlan?`<div class="flags">${vlist.length?`<b>Monotony conflict:</b> ${curPlan} ${curElev} also on ${vlist.map(x=>`<span class="tag">${x}</span>`).join('')} within 3 lots.`:(s?`No monotony conflict.`:'')}</div>`:''}
    <div class="flags" style="margin-top:12px">Neighbors: ${(DATA.adj[sel]||[]).map(x=>`<span class="tag">${x}</span>`).join('')||'—'}</div>`;
  document.getElementById('planSel').onchange=e=>{const pl=e.target.value;
    if(pl)state[sel]={plan:pl,elev:'',_pick:!isBuilt,built:isBuilt};else delete state[sel];draw();};
    /* no push here — an elevation-less pick is incomplete; push happens on Assign */
  document.getElementById('elevSel').onchange=e=>{if(state[sel]){state[sel].elev=e.target.value;draw();}};
  document.getElementById('assignBtn').onclick=()=>{const pl=document.getElementById('planSel').value,el=document.getElementById('elevSel').value;
    if(pl&&el){const prev=state[sel]?{...state[sel]}:null;
      state[sel]={plan:pl,elev:el,_pick:!isBuilt,built:isBuilt};draw();pushLot(sel,state[sel],prev);}};
  document.getElementById('clearBtn').onclick=()=>{const prev=state[sel]?{...state[sel]}:null;
    delete state[sel];draw();pushLot(sel,null,prev);};
}
applyView();draw();initSync();
</script></body></html>
